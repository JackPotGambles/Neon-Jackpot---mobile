<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Neon Jackpot fictional arcade demo — Black Market" />
    <title>Black Market · Neon Jackpot</title>
    <link rel="stylesheet" href="./shell.css" />
    <style>
      .content { max-width: 900px; margin: auto; padding: 34px 32px 60px; }
      .bm-eyebrow { display: flex; align-items: center; gap: 8px; color: #ff5c9f; font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
      .bm-eyebrow i { width: 25px; height: 1px; background: #ff5c9f; }
      h1 { max-width: 580px; margin: 10px 0 0; font-size: clamp(26px, 3.4vw, 38px); font-weight: 800; letter-spacing: -.05em; line-height: 1; }
      .bm-sub { max-width: 560px; margin: 10px 0 26px; color: #8791a6; font-size: 12.5px; line-height: 1.55; }
      .bm-section-title { margin: 28px 0 12px; font-size: 15px; font-weight: 800; }
      .bm-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; margin-bottom: 10px; background: #121522; border: 1px solid var(--line); border-radius: 12px; }
      .bm-row-name { font-size: 12.5px; font-weight: 800; }
      .bm-row-sub { margin-top: 3px; color: #69758c; font-size: 10.5px; }
      .bm-row button { padding: 9px 14px; color: #04140f; background: var(--mint); border: 0; border-radius: 9px; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
      .bm-row button:disabled { color: #6c7488; background: #1b2032; }
      .bm-empty { padding: 20px; color: #69758c; font-size: 12px; text-align: center; background: #121522; border: 1px solid var(--line); border-radius: 12px; }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <div class="site-grid">
        <div id="site-sidebar"></div>
        <div id="site-topbar"></div>
        <div id="page-content"></div>
      </div>
    </div>
    <script src="./promo-vault.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="./chat.js"></script>
    <script src="./shell.js"></script>
    <script src="./games.js"></script>
    <script>
      (() => {
        Shell.mount({ activeTab: "Black Market" });
        Chat.mount();
        const content = document.getElementById("page-content");

        function paint() {
          const state = Shell.getBlackMarketState();
          const inventory = Shell.getInventory();
          const activeBoosts = Shell.getActiveBoosts();

          const stockHTML = Shell.BM_CATALOG.map((def) => {
            const item = state.items.find((i) => i.id === def.id);
            if (!item) {
                return `<div class="bm-row">
                <div>
                    <div class="bm-row-name">${def.label}</div>
                    <div class="bm-row-sub">Not available today</div>
                </div>
                <button disabled>Unavailable</button>
                </div>`;
            }
            const price = Shell.blackMarketPrice(def);
            const canAfford = Shell.getCashBalance() >= price;
            return `<div class="bm-row">
                <div>
                <div class="bm-row-name">${def.label}</div>
                <div class="bm-row-sub">${item.remaining}/${item.total} left${def.durationMin ? ` · lasts ${def.durationMin} min` : ""}</div>
                </div>
                <button data-buy="${item.id}" ${item.remaining <= 0 || !canAfford ? "disabled" : ""}>Buy — ${Shell.fmtMoney(price)}</button>
            </div>`;
            }).join("");

          const inventoryHTML = inventory.length ? inventory.map((p) => {
            const def = Shell.BM_CATALOG.find((d) => d.id === p.id);
            return `<div class="bm-row">
              <div class="bm-row-name">${def.label}</div>
              <button data-activate="${p.id}">Use Now</button>
            </div>`;
          }).join("") : `<div class="bm-empty">Nothing purchased yet.</div>`;

          const boostsHTML = activeBoosts.length ? activeBoosts.map((b) => {
            const def = Shell.BM_CATALOG.find((d) => d.id === b.id);
            const remainMin = Math.max(0, Math.ceil((b.expiresAt - Date.now()) / 60000));
            return `<div class="bm-row"><div class="bm-row-name">${def.label}</div><div class="bm-row-sub">${remainMin}m left</div></div>`;
          }).join("") : `<div class="bm-empty">No boosts active.</div>`;

          content.innerHTML = `<div class="content">
            <div class="bm-eyebrow"><i></i> Daily rotation</div>
            <h1>Black <em style="color:var(--mint);font-style:normal;">Market</em></h1>
            <p class="bm-sub">A new stock of boosts and items appears every day. Buy with cash, then activate from your inventory whenever you want the effect to start.</p>

            <div class="bm-section-title">Today's Stock</div>
            ${stockHTML}

            <div class="bm-section-title">Your Inventory (unused)</div>
            ${inventoryHTML}

            <div class="bm-section-title">Active Boosts</div>
            ${boostsHTML}
          </div>`;

          content.querySelectorAll("[data-buy]").forEach((btn) => btn.onclick = () => {
            if (Shell.buyBlackMarketItem(btn.dataset.buy)) { Shell.playChipSound("select"); paint(); }
            else { Shell.notify("Couldn't buy that — check your balance or stock."); }
          });
          content.querySelectorAll("[data-activate]").forEach((btn) => btn.onclick = () => {
            if (Shell.activateBoost(btn.dataset.activate)) paint();
          });
        }

        paint();
        setInterval(paint, 1000);
      })();
    </script>
  </body>
</html>
