<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Neon Jackpot fictional arcade demo — Rock Paper Scissors" />
    <title>Rock Paper Scissors · Neon Jackpot</title>
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./game-frame.css" />
    <style>
      /* ===== Rock Paper Scissors stage styling ===== */
      .game-box.rps-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        min-height: 420px;
        padding: 30px 0;
      }

      /* Horizontally scrolling track. Each round is one column: house card on top,
         multiplier pill in the middle, player card on the bottom — all three stacked
         and colored together once that round resolves. Playing a round (win, tie, or
         loss) always appends a new column and the track auto-scrolls so the newest
         column stays in view, which reads as the whole run "shifting" left. */
      .rps-track-wrap { position: relative; width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 10px; }
      .rps-track {
        display: flex;
        justify-content: center;
        gap: 14px;
        overflow-x: auto;
        padding: 4px 4px 2px;
        scroll-behavior: smooth;
        scrollbar-width: none;
      }
      .rps-track::-webkit-scrollbar { display: none; }
      /* House row sits ABOVE the multiplier row: cards bottom-align to it, so a taller
         "current" card grows upward only, without pushing the pill row down. */
      .rps-track-house { align-items: flex-end; }
      /* Player row sits BELOW the multiplier row: cards top-align to it, so a taller
         "current" card grows downward only. */
      .rps-track-player { align-items: flex-start; }
      .rps-track-pill { align-items: center; }

      .rps-card {
        position: relative;
        width: 78px; height: 108px;
        flex: 0 0 auto;
        display: grid; place-items: center;
        border-radius: 12px;
        background: linear-gradient(160deg, #2a3170, #1a1e3d);
        border: 1.5px solid var(--line);
        transition: border-color .15s ease, box-shadow .15s ease;
      }
      .rps-card .rps-hand-icon { width: 32px; height: 32px; color: #eef3f8; }
      .rps-card.house .rps-hand-icon { color: #cdd4e2; }
      .rps-card .rps-card-back {
        display: grid; place-items: center; width: 100%; height: 100%;
        background: rgba(255,255,255,.03);
        border-radius: 10px;
      }
      .rps-card.current { height: 122px; border-color: #ffffff; box-shadow: 0 0 0 3px rgba(255,255,255,.12); }
      .rps-card.current.lose { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255,110,143,.16); }
      .rps-card.current.lose .rps-hand-icon { color: var(--red); }
      .rps-card.blank { background: rgba(255,255,255,.02); border-color: rgba(255,255,255,.06); }
      .rps-card.win { border-color: var(--mint); box-shadow: 0 0 0 3px rgba(92,255,231,.16); }
      .rps-card.win .rps-hand-icon { color: var(--mint); }
      .rps-card.tie { border-color: #ffcf7d; box-shadow: 0 0 0 3px rgba(255,207,125,.16); }
      .rps-card.tie .rps-hand-icon { color: #ffcf7d; }
      .rps-card.lose { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255,110,143,.16); }
      .rps-card.lose .rps-hand-icon { color: var(--red); }

      .rps-mult-pill {
        min-width: 78px;
        flex: 0 0 auto;
        padding: 6px 10px;
        text-align: center;
        border-radius: 999px;
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 800;
        color: #8791a6;
        background: #12152a;
        border: 1px solid var(--line);
      }
      .rps-mult-pill.win { color: #04140f; background: var(--mint); border-color: transparent; }
      .rps-mult-pill.tie { color: #ffcf7d; background: rgba(255,207,125,.1); border-color: rgba(255,207,125,.6); }
      .rps-mult-pill.lose { color: var(--red); background: rgba(255,110,143,.1); border-color: rgba(255,110,143,.6); }
      .rps-mult-pill.current { color: #eef3f8; background: #1c2340; border-color: #ffffff; }

      .rps-vs-icon { color: #55617a; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; text-align: center; }

      .rps-choice-row { display: flex; gap: 12px; }
      .rps-choice-btn {
        display: grid; place-items: center;
        width: 74px; height: 74px;
        color: #cdd4e2;
        background: #171c30;
        border: 1px solid var(--line);
        border-radius: 16px;
        transition: transform .1s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
      }
      .rps-choice-btn svg { width: 28px; height: 28px; }
      .rps-choice-btn:hover:not(:disabled) { border-color: rgba(58,160,255,.5); background: #1c2340; transform: translateY(-2px); }
      .rps-choice-btn:active:not(:disabled) { transform: translateY(0) scale(.96); }
      .rps-choice-btn:disabled { opacity: .35; cursor: not-allowed; }
      .rps-choice-btn.picked { border-color: var(--mint); background: rgba(92,255,231,.1); color: var(--mint); box-shadow: 0 0 0 2px rgba(92,255,231,.18); }

      .rps-status-line { min-height: 18px; font-size: 12px; font-weight: 700; text-align: center; }
      .rps-status-line.win { color: var(--mint); }
      .rps-status-line.lose { color: var(--red); }
      .rps-status-line.tie { color: #ffcf7d; }
      .rps-status-line.idle { color: #69758c; font-weight: 600; }

      .rps-cashout-btn {
        width: 100%; margin-top: 10px; padding: 12px 0;
        color: #04140f; background: linear-gradient(120deg, #ffcf7d, #ffb45c);
        border: 0; border-radius: 12px;
        font-size: 12.5px; font-weight: 800;
        box-shadow: 0 10px 24px rgba(255,207,125,.28);
      }
      .rps-cashout-btn:disabled { color: #6c7488; background: #1b2032; box-shadow: none; }

      .payout-box {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #171c30;
        border: 1px solid var(--line);
      }
      .payout-box-top {
        display: flex; align-items: center; justify-content: space-between;
        font-size: 11px; font-weight: 700; color: #8791a6;
      }
      .payout-box-top strong { color: var(--text); font-family: var(--mono); font-size: 12px; }
      .payout-box-bottom {
        margin-top: 6px;
        text-align: center;
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 800;
        color: var(--text);
        letter-spacing: .03em;
      }
      .payout-box-bottom.demo { color: var(--mint); letter-spacing: .08em; }

      @media (max-width: 700px) {
        .rps-card { width: 60px; height: 84px; }
        .rps-mult-pill { min-width: 60px; font-size: 10px; padding: 5px 6px; }
        .rps-player-card { width: 62px; height: 88px; }
        .rps-choice-btn { width: 62px; height: 62px; }
        .rps-choice-btn svg { width: 24px; height: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <div class="site-grid">
        <div id="site-sidebar"></div>
        <div id="site-topbar"></div>
        <div id="page-content"></div>
      </div>
    </div>
    <script src="./promo-vault.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="./chat.js"></script>
    <script src="./shell.js"></script>
    <script src="./games.js"></script>
    <script>
      (() => {
        const GAME_NAME = "Rock Paper Scissors";
        const GAME_ID   = "rockpaperscissors";

        Shell.mount({ activeTab: "Games" });
        Chat.mount();
        document.addEventListener("nj:animations", (e) => { state.settings.animations = !e.detail; render(); });
        const content = document.getElementById("page-content");
        const svg = Shell.svg;

        // Hand icons drawn locally — the shared Shell.svg() set has no rock/paper/scissors glyphs.
        const HAND_ICON = {
          rock:     '<path d="M7 12.5V9a2 2 0 0 1 4 0v-.5a2 2 0 0 1 4 0V9a2 2 0 0 1 4 0v4.5a5.5 5.5 0 0 1-5.5 5.5h-1A6.5 6.5 0 0 1 6 12.5v-2a1.6 1.6 0 0 1 3.2 0"/>',
          paper:    '<path d="M8 11V6a1.6 1.6 0 0 1 3.2 0v4.5M11.2 10V5a1.6 1.6 0 0 1 3.2 0v5M14.4 10.5V6.5a1.6 1.6 0 0 1 3.2 0V14a5.5 5.5 0 0 1-5.5 5.5h-1A6.5 6.5 0 0 1 4.7 13v-1.8a1.5 1.5 0 0 1 3 0V13"/>',
          scissors: '<circle cx="7" cy="7" r="2.3"/><circle cx="7" cy="17" r="2.3"/><path d="M20 5 9 15M20 19 9 9"/>',
        };
        function handIcon(kind, extraClass) {
          return `<svg class="rps-hand-icon ${extraClass || ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${HAND_ICON[kind] || ""}</svg>`;
        }

        const HANDS = ["rock", "paper", "scissors"];
        const BEATS = { rock: "scissors", paper: "rock", scissors: "paper" };
        // BASE_MULT is the payout for round 1. Every subsequent WIN doubles the target
        // multiplier (1.96 -> 3.92 -> 7.84 -> 15.68 -> 31.36 ...). A TIE does not move the
        // target at all — the same multiplier stays in play for the next throw, it's just
        // visually marked yellow instead of green. A LOSS ends the run. There's no fixed
        // number of rounds; the streak runs until a loss, a manual cash-out, or the cap.
        const BASE_MULT = 1.96;
        const MAX_MULT = 10000;
        const MIN_BET = 0.10;

        const state = {
          betAmount: "1.00",
          mode: "manual",           // manual | auto
          busy: false,
          history: [],              // [{ player, house, result: "win"|"lose"|"tie", mult }]
          targetMult: BASE_MULT,    // multiplier currently at stake for the round in progress
          bankedMult: 0,            // multiplier locked in by the most recent win (0 = none yet, nothing to cash out)
          playerPick: null,
          lastHouseThrow: null,     // house's throw on the most recent loss, so the frozen current slot can show it
          roundOutcome: null,       // "win" | "lose" | "tie" | null — outcome of the most recent throw
          runOver: false,
          runResult: null,          // { won, profit, payoutLabel } once settled, for the status line
          activeBet: 0,             // locked-in bet amount for the current run; 0 means no run in progress
          infoOpen: false,
          fairPlayOpen: false,
          settingsOpen: false,
          statsOpen: false,
          statsGame: "all",
          statsGameDropdownOpen: false,
          statsDrag: null,
          statsPos: null,
          favorite: Shell.getFavorites().includes(GAME_ID),
          settings: { animations: !Shell.isAnimationsDisabled(), volume: 100 },
        };

        // Every settled round — win OR lose — MUST call this exactly once per run.
        // The bet amount itself is deducted immediately in startRun(); this only records
        // stats and, on a win, pays out the winnings (the original stake is already gone
        // from the balance, so a win pays the full mult * bet back in).
        function recordBet(betAmount, result) {
          Shell.addBetEntry({ game: GAME_ID, bet: betAmount, won: result.won, profit: result.profit });
        }

        function startRun() {
          if (state.busy) return;
          const amt = Math.round((parseFloat(state.betAmount) || 0) * 100) / 100;
          if (!(amt > 0)) return;
          if (amt < MIN_BET) { Shell.notify(`Minimum bet is ${Shell.fmtMoney(MIN_BET)}.`); return; }
          if (amt > Shell.getBalance()) { Shell.notify("Insufficient balance."); return; }

          // Take the bet out of the balance right away — it's paid back (with winnings)
          // only if/when the player cashes out.
          Shell.addBalance(-amt);

          // A fresh bet resets the whole run — history and card positions included.
          state.activeBet = amt;
          state.history = [];
          state.targetMult = BASE_MULT;
          state.bankedMult = 0;
          state.playerPick = null;
          state.lastHouseThrow = null;
          state.roundOutcome = null;
          state.runOver = false;
          state.runResult = null;
          render();
        }

        function throwHand(pick) {
          if (state.busy || state.runOver || !state.activeBet) return;
          state.busy = true;
          state.playerPick = pick;
          render();
          Shell.playChipSound("place", state.settings.volume);

          setTimeout(() => {
            const house = HANDS[Math.floor(Math.random() * 3)];
            let outcome;
            if (house === pick) outcome = "tie";
            else if (BEATS[pick] === house) outcome = "win";
            else outcome = "lose";
            state.roundOutcome = outcome;

            if (outcome === "lose") {
              // A loss freezes the run in place — it is NOT pushed into history, so the
              // current slot simply displays the losing throw and stays put (no shift)
              // until a fresh bet is placed.
              state.lastHouseThrow = house;
              const result = { won: false, profit: -state.activeBet, payoutLabel: "0.00x" };
              recordBet(state.activeBet, result);
              state.runOver = true;
              state.runResult = result;
              state.busy = false;
              render();
              return;
            }

            // Win or tie: this round is resolved and slides into history, shifting the
            // whole track one placeholder to the left; a fresh, normal-sized current slot
            // opens up in the middle for the next throw.
            state.history.push({ player: pick, house, result: outcome, mult: state.targetMult });

            if (outcome === "tie") {
              // Target multiplier is unchanged — the next throw plays for the same amount.
              state.busy = false;
              render();
              if (state.mode === "auto") setTimeout(() => throwHand(HANDS[Math.floor(Math.random() * 3)]), 650);
              return;
            }

            // Win: bank this round's multiplier (what Cash Out would pay right now), then
            // double the target for the next round.
            state.bankedMult = state.targetMult;
            if (state.bankedMult >= MAX_MULT) {
              settleWin();
              return;
            }
            state.targetMult = Math.min(state.targetMult * 2, MAX_MULT);
            state.busy = false;
            render();
            if (state.mode === "auto") setTimeout(() => throwHand(HANDS[Math.floor(Math.random() * 3)]), 650);
          }, 550);
        }

        function settleWin() {
          const mult = state.bankedMult;
          const profit = state.activeBet * (mult - 1);
          const result = { won: true, profit, payoutLabel: `${mult.toFixed(2)}x` };
          recordBet(state.activeBet, result);
          // Pay back the full amount (original stake + profit) — the stake was already
          // deducted from the balance when the run started.
          Shell.addBalance(state.activeBet * mult);
          state.runOver = true;
          state.runResult = result;
          state.busy = false;
          Shell.notify(`Cashed out at ${mult.toFixed(2)}x — +${Shell.fmtMoney(profit)}`);
        }

        function cashOut() {
          if (state.busy || state.runOver || state.bankedMult <= 0) return;
          settleWin();
          render();
        }

        function render() {
          const balance = Shell.getBalance();
          const insufficientBalance = (parseFloat(state.betAmount) || 0) > balance;
          const belowMinBet = (parseFloat(state.betAmount) || 0) > 0 && (parseFloat(state.betAmount) || 0) < MIN_BET;
          const canStart = !state.activeBet || state.runOver;
          const r = state.runResult;

          // Payout box: shows "DEMO" while no real money is on the bet (amount is 0/blank),
          // otherwise shows the live multiplier at stake and the running payout it maps to.
          const betNum = parseFloat(state.betAmount) || 0;
          const isDemoBet = betNum <= 0;
          const payoutMult = state.activeBet ? (state.bankedMult > 0 ? state.bankedMult : state.targetMult) : 1;
          const payoutAmount = (state.activeBet || betNum) * payoutMult;

          // Fixed, non-scrolling track: 3 "past" slots (filled with the most recent
          // resolved win/tie rounds, oldest falling off as new ones come in — that's what
          // reads as the run "shifting left" one placeholder at a time), 1 current slot in
          // the middle, and 3 upcoming slots — symmetric so the current slot sits dead
          // center. The total column count never changes, so the current slot always sits
          // in the same screen position — nothing ever scrolls.
          const PAST_SLOTS = 3;
          // Each entry: { house: html, pill: html, player: html }. Built as three parallel
          // lists (not stacked columns) so the house row can be rendered bottom-aligned and
          // the player row top-aligned — that's what lets only the *current* card grow
          // upward (house) / downward (player) without dragging its neighbors' pill or
          // pushing the row out of alignment.
          const houseCells = [], pillCells = [], playerCells = [];

          const pastWindow = state.history.slice(-PAST_SLOTS);
          const pastBlanks = PAST_SLOTS - pastWindow.length;
          for (let i = 0; i < pastBlanks; i++) {
            houseCells.push(`<div class="rps-card house blank"><div class="rps-card-back"></div></div>`);
            pillCells.push(`<div class="rps-mult-pill"></div>`);
            playerCells.push(`<div class="rps-card blank"><div class="rps-card-back"></div></div>`);
          }
          pastWindow.forEach((h) => {
            const cls = h.result; // "win" | "tie"
            houseCells.push(`<div class="rps-card house ${cls}">${handIcon(h.house, "house")}</div>`);
            pillCells.push(`<div class="rps-mult-pill ${cls}">${h.mult.toFixed(2)}x</div>`);
            playerCells.push(`<div class="rps-card ${cls}">${handIcon(h.player)}</div>`);
          });

          // Current slot — the only cards allowed to grow taller than the rest of the row.
          const frozenLoss = state.runOver && state.roundOutcome === "lose";
          const currentActive = (state.activeBet && !state.runOver) || frozenLoss;
          if (frozenLoss) {
            houseCells.push(`<div class="rps-card house current lose">${handIcon(state.lastHouseThrow, "house")}</div>`);
            pillCells.push(`<div class="rps-mult-pill current lose">0.00x</div>`);
            playerCells.push(`<div class="rps-card current lose">${handIcon(state.playerPick)}</div>`);
          } else if (currentActive) {
            houseCells.push(`<div class="rps-card house current">${state.busy ? `<div class="rps-card-back">…</div>` : `<div class="rps-card-back">?</div>`}</div>`);
            pillCells.push(`<div class="rps-mult-pill current">${state.targetMult.toFixed(2)}x</div>`);
            playerCells.push(`<div class="rps-card current">${state.busy && state.playerPick ? handIcon(state.playerPick) : `<div class="rps-card-back">?</div>`}</div>`);
          } else {
            houseCells.push(`<div class="rps-card house blank"><div class="rps-card-back"></div></div>`);
            pillCells.push(`<div class="rps-mult-pill"></div>`);
            playerCells.push(`<div class="rps-card blank"><div class="rps-card-back"></div></div>`);
          }

          // Upcoming placeholders show their real future multiplier values up front
          // (matching the reference game) rather than hiding them until reached. These are
          // NOT translucent "blank" cards — only past/history placeholders are dimmed.
          const upcoming = 3;
          let nextMult = state.activeBet && !state.runOver ? Math.min(state.targetMult * 2, MAX_MULT) : BASE_MULT;
          for (let i = 0; i < upcoming; i++) {
            houseCells.push(`<div class="rps-card house"><div class="rps-card-back"></div></div>`);
            pillCells.push(`<div class="rps-mult-pill">${nextMult.toFixed(2)}x</div>`);
            playerCells.push(`<div class="rps-card"><div class="rps-card-back"></div></div>`);
            nextMult = Math.min(nextMult * 2, MAX_MULT);
          }

          const statusText = (() => {
            if (!state.activeBet) return { cls: "idle", text: "Place a bet and throw to start a streak." };
            if (state.busy) return { cls: "idle", text: "…" };
            if (r && r.won) return { cls: "win", text: `Cashed out at ${r.payoutLabel}!` };
            if (r && !r.won) return { cls: "lose", text: "House wins — streak broken." };
            if (state.roundOutcome === "tie") return { cls: "tie", text: `Tie — ${state.targetMult.toFixed(2)}x stays in play, throw again.` };
            return { cls: "idle", text: `Win to reach ${state.targetMult.toFixed(2)}x, or cash out any time after a win.` };
          })();

          const disableThrow = state.busy || !state.activeBet || state.runOver;

          content.innerHTML = `
            <div class="game-page">
              <div class="game-shell">
                <div class="shell-grid">

                  <header class="title-bar">
                    <button class="game-icon-btn hover-tip" data-hover-tip="Game info" data-info>${svg("safe")}</button>
                    <div class="title-name">${GAME_NAME}</div>
                    <button class="fair-play-btn" data-fair-play>${svg("safe")} Fair Play</button>
                  </header>

                  <aside class="sidebar">
                    <div class="mode-toggle">
                      <button class="mode-btn ${state.mode === "manual" ? "active" : ""}" data-mode="manual">Manual</button>
                      <button class="mode-btn ${state.mode === "auto" ? "active" : ""}" data-mode="auto">Auto</button>
                    </div>

                    <div class="field-label">Bet Amount</div>
                    <div class="bet-input-row">
                      <span class="prefix">$</span>
                      <input type="text" inputmode="decimal" placeholder="0.00" value="${state.betAmount}" data-bet-input class="${insufficientBalance || belowMinBet ? "error" : ""}" ${state.busy || (state.activeBet && !state.runOver) ? "disabled" : ""}>
                      <div class="bet-quick">
                        <button data-half>½</button>
                        <button data-double-bet>2×</button>
                      </div>
                    </div>
                    ${insufficientBalance ? `<div class="balance-error">Insufficient balance</div>` : ""}
                    ${!insufficientBalance && belowMinBet ? `<div class="balance-error">Minimum bet is ${Shell.fmtMoney(MIN_BET)}</div>` : ""}

                    <div class="payout-box">
                      <div class="payout-box-top"><span>Payout</span><strong>${payoutMult.toFixed(2)}x</strong></div>
                      <div class="payout-box-bottom ${isDemoBet ? "demo" : ""}">${isDemoBet ? "DEMO" : Shell.fmtMoney(payoutAmount)}</div>
                    </div>

                    ${canStart ? `
                    <button class="place-bet-btn" data-start ${state.busy || insufficientBalance || belowMinBet || !(parseFloat(state.betAmount) > 0) ? "disabled" : ""}>
                      Place Bet
                    </button>` : `
                    <button class="rps-cashout-btn" data-cashout ${state.busy || state.bankedMult <= 0 ? "disabled" : ""}>
                      Cash Out ${state.bankedMult > 0 ? `— ${state.bankedMult.toFixed(2)}x (${Shell.fmtMoney(state.activeBet * state.bankedMult)})` : ""}
                    </button>`}

                    <div class="sidebar-meta">
                      <div class="sidebar-meta-row"><span>Balance</span><strong>${Shell.fmtMoney(balance)}</strong></div>
                      <div class="sidebar-meta-row"><span>Next win pays</span><strong>${state.targetMult.toFixed(2)}x</strong></div>
                      <div class="sidebar-meta-row"><span>Max multiplier</span><strong>${MAX_MULT.toLocaleString()}x</strong></div>
                    </div>
                  </aside>

                  <section class="game-box rps-stage">
                    <div class="rps-track-wrap">
                      <div class="rps-track rps-track-house" data-rps-track>${houseCells.join("")}</div>
                      <div class="rps-track rps-track-pill">${pillCells.join("")}</div>
                      <div class="rps-track rps-track-player">${playerCells.join("")}</div>
                    </div>

                    <div class="rps-status-line ${statusText.cls}">${statusText.text}</div>

                    <div class="rps-choice-row">
                      ${HANDS.map((h) => `<button class="rps-choice-btn ${state.playerPick === h && state.busy ? "picked" : ""}" data-throw="${h}" ${disableThrow ? "disabled" : ""} title="${h[0].toUpperCase()}${h.slice(1)}">${handIcon(h)}</button>`).join("")}
                    </div>
                  </section>

                  <footer class="bottom-bar">
                    <div class="bottom-icons">
                      <div style="position:relative;">
                        <button class="bottom-icon-btn ${state.settingsOpen ? "active" : ""}" data-settings-toggle title="Settings">${svg("settings")}</button>
                        ${state.settingsOpen ? `
                        <div class="popover" data-settings-popover>
                          <div class="popover-title">Game Settings</div>
                          <div class="popover-row"><span>Animations</span><button class="switch ${state.settings.animations ? "on" : ""}" data-toggle-setting="animations" ${Shell.isAnimationsDisabled() ? "disabled" : ""}></button></div>
                          <div class="volume-row"><span>Volume — ${state.settings.volume}%</span><input type="range" min="0" max="100" value="${state.settings.volume}" data-volume-slider></div>
                        </div>` : ""}
                      </div>
                      <button class="bottom-icon-btn ${state.favorite ? "fav-on" : ""}" data-fav-toggle title="Favorite">${svg("heart")}</button>
                      <button class="bottom-icon-btn ${state.statsOpen ? "active" : ""}" data-stats-toggle title="Live stats">${svg("activity")}</button>
                    </div>
                    <div class="bottom-logo">Neon Jackpot</div>
                  </footer>
                </div>

                ${Shell.statsPanelHTML(state, GAME_ID, GAME_NAME)}
              </div>
            </div>

            ${state.infoOpen ? `
            <div class="modal-overlay" data-info-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${GAME_NAME}</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Pick a bet amount, then throw Rock, Paper, or Scissors against the house each round. There's no fixed number of rounds — the streak runs until you lose, cash out, or hit the cap.</p>
                <p>A <strong>win</strong> banks the current multiplier (what Cash Out would pay) and doubles the target for the next round. A <strong>tie</strong> still moves you to a new round, but the target multiplier stays exactly the same. A <strong>loss</strong> ends the run and the bet is lost — cash out after any win to lock in your banked multiplier before that happens.</p>
                <p>Multiplier progression: ${BASE_MULT}x → ${(BASE_MULT * 2).toFixed(2)}x → ${(BASE_MULT * 4).toFixed(2)}x → ${(BASE_MULT * 8).toFixed(2)}x → … capped at ${MAX_MULT.toLocaleString()}x</p>
              </div>
            </div>` : ""}

            ${state.fairPlayOpen ? `
            <div class="modal-overlay" data-fair-play-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${svg("safe")} Fair Play</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Each house throw is generated independently at random the moment you play — Rock, Paper, and Scissors are equally likely (1/3 each), so ties, wins, and losses are all genuine 1-in-3 outcomes before accounting for the payout curve.</p>
                <p>This is a demo game with client-side randomness only — no real seed/nonce commitment is used here.</p>
              </div>
            </div>` : ""}
          `;

          bind();
        }

        function refocus(sel) {
          const el = document.querySelector(sel);
          if (el) { el.focus(); const v = el.value; el.value = ""; el.value = v; }
        }

        function bind() {
          document.querySelector("[data-start]")?.addEventListener("click", startRun);
          document.querySelector("[data-cashout]")?.addEventListener("click", cashOut);
          document.querySelectorAll("[data-throw]").forEach((b) => b.addEventListener("click", () => throwHand(b.dataset.throw)));

          document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { state.mode = b.dataset.mode; render(); }));

          const betInput = document.querySelector("[data-bet-input]");
          betInput?.addEventListener("input", (e) => {
            state.betAmount = e.target.value.replace(/[^0-9.]/g, "");
            render();
            refocus("[data-bet-input]");
          });
          document.querySelector("[data-half]")?.addEventListener("click", () => {
            const b = parseFloat(state.betAmount) || 0;
            state.betAmount = Math.max(b / 2, MIN_BET).toFixed(2);
            render();
          });
          document.querySelector("[data-double-bet]")?.addEventListener("click", () => {
            const b = parseFloat(state.betAmount) || 0;
            state.betAmount = Math.min(b * 2 || 0, Shell.getBalance()).toFixed(2);
            render();
          });

          document.querySelector("[data-info]")?.addEventListener("click", () => { state.infoOpen = true; render(); });
          document.querySelector("[data-fair-play]")?.addEventListener("click", () => { state.fairPlayOpen = true; render(); });
          document.querySelectorAll("[data-modal-close]").forEach((btn) => btn.onclick = () => { state.infoOpen = false; state.fairPlayOpen = false; render(); });
          document.querySelector("[data-info-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.infoOpen = false; render(); } });
          document.querySelector("[data-fair-play-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.fairPlayOpen = false; render(); } });

          document.querySelector("[data-settings-toggle]")?.addEventListener("click", () => { state.settingsOpen = !state.settingsOpen; render(); });
          document.querySelector("[data-toggle-setting]")?.addEventListener("click", (e) => {
            const key = e.currentTarget.dataset.toggleSetting;
            state.settings[key] = !state.settings[key];
            render();
          });
          document.querySelector("[data-volume-slider]")?.addEventListener("input", (e) => { state.settings.volume = parseInt(e.target.value, 10); });

          document.querySelector("[data-fav-toggle]")?.addEventListener("click", () => {
            Shell.toggleFavorite(GAME_ID);
            state.favorite = Shell.getFavorites().includes(GAME_ID);
            render();
          });

          document.querySelector("[data-stats-toggle]")?.addEventListener("click", () => { state.statsOpen = !state.statsOpen; render(); });
          Shell.bindStatsPanel(state, render);

          document.addEventListener("click", (e) => {
            if (state.settingsOpen && !e.target.closest("[data-settings-popover]") && !e.target.closest("[data-settings-toggle]")) {
              state.settingsOpen = false; render();
            }
          }, { once: true });
        }

        Shell.attachStatsPanelDrag(state, render);

        render();
      })();
    </script>
  </body>
</html>
