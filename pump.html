
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Pump · Neon Jackpot</title>
    <link rel="stylesheet" href="./shell.css" />

    <style>
      /* ---- stage ---- */
      .game-box.pump-stage {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 0;
        background: linear-gradient(160deg, #182d42, #16203d 56%, #321849);
        position: relative;
        overflow: hidden;
      }
      .pump-balloon-wrap {
        position: relative;
        flex: 1;
        min-height: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
 
      /* balloon shape via border-radius trick; scale grows with pumps */
      .pump-balloon {
        position: relative;
        width: 148px;
        height: 178px;
        border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%;
        background: radial-gradient(circle at 32% 26%, #ff8fa8, var(--red) 55%, #c22e4f 100%);
        box-shadow: 0 18px 46px rgba(255, 92, 143, 0.35);
        transform: scale(var(--bscale, 1));
        transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, box-shadow 0.3s ease;
        transform-origin: center bottom;
      }
      .pump-balloon::before {
        /* shine highlight */
        content: "";
        position: absolute;
        top: 16%;
        left: 22%;
        width: 26%;
        height: 16%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        filter: blur(1px);
      }
      .pump-balloon::after {
        /* knot */
        content: "";
        position: absolute;
        left: 50%;
        bottom: -12px;
        width: 0;
        height: 0;
        transform: translateX(-50%);
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        border-top: 14px solid #c22e4f;
      }
      .pump-balloon.pumping { animation: pump-squish 0.3s ease; }
      @keyframes pump-squish {
        0% { transform: scale(var(--bscale, 1)); }
        40% { transform: scale(calc(var(--bscale, 1) * 1.1), calc(var(--bscale, 1) * 0.92)); }
        100% { transform: scale(var(--bscale, 1)); }
      }
      .pump-balloon.popped { animation: pump-pop-out 0.32s ease forwards; }
      @keyframes pump-pop-out {
        0% { transform: scale(var(--bscale, 1)); opacity: 1; }
        45% { transform: scale(calc(var(--bscale, 1) * 1.35)); opacity: 1; }
        100% { transform: scale(calc(var(--bscale, 1) * 1.6)); opacity: 0; }
      }
      .no-animations .pump-balloon,
      .no-animations .pump-balloon.pumping,
      .no-animations .pump-balloon.popped { animation: none !important; transition: none !important; }
 
      .pump-string {
        position: absolute;
        left: 50%;
        top: calc(50% + 30px);
        transform: translateX(-50%);
        width: 2px;
        height: 90px;
        background: repeating-linear-gradient(180deg, rgba(255,255,255,.4) 0 4px, transparent 4px 8px);
        z-index: 1;
      }
      .pump-stand {
        position: absolute;
        left: 50%;
        bottom: 54px;
        transform: translateX(-50%);
        width: 30px;
        height: 46px;
        background: linear-gradient(160deg, #3a4360, #232948);
        border-radius: 6px 6px 3px 3px;
        z-index: 2;
      }
      .pump-ground {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 60px;
        background: linear-gradient(180deg, transparent, rgba(0,0,0,.28));
        border-top: 1px solid rgba(255,255,255,.06);
      }
 
      .pump-mult-readout {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        font-family: var(--mono);
        font-size: clamp(26px, 5vw, 42px);
        font-weight: 800;
        color: #fff;
        text-shadow: 0 2px 10px rgba(0,0,0,.5);
        pointer-events: none;
      }
      .pump-mult-readout.popped { color: #ffe1e8; }
 
      .pump-pop-label {
        position: absolute;
        top: 22%; left: 50%;
        transform: translate(-50%, -50%) scale(0.6);
        z-index: 6;
        color: var(--red);
        font-weight: 900;
        font-size: 30px;
        letter-spacing: .06em;
        opacity: 0;
        text-shadow: 0 0 18px rgba(255,110,143,.8);
        animation: pump-pop-label 0.5s ease 0.05s forwards;
      }
      @keyframes pump-pop-label {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(-8deg); }
        50% { opacity: 1; transform: translate(-50%, -70%) scale(1.15) rotate(4deg); }
        100% { opacity: 1; transform: translate(-50%, -90%) scale(1) rotate(0deg); }
      }
      .no-animations .pump-pop-label { animation: none !important; opacity: 1; }
      .pump-pop-label.no-anim { animation: none !important; opacity: 1; }
 
      /* multiplier ladder strip along the bottom of the stage */
      .pump-ladder-wrap { position: relative; z-index: 3; border-top: 1px solid rgba(255,255,255,.06); background: rgba(6,8,14,.4); }
      .pump-ladder {
        display: flex;
        gap: 6px;
        padding: 12px 14px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .pump-ladder::-webkit-scrollbar { display: none; }
      .pump-ladder-step {
        flex: none;
        min-width: 62px;
        padding: 8px 10px;
        text-align: center;
        border-radius: 9px;
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 800;
        color: #8791a6;
        background: #171c2c;
        border: 1px solid var(--line);
      }
      .pump-ladder-step.cleared { color: #55617a; background: #12152a; border-color: var(--line); opacity: .65; }
      .pump-ladder-step.current { color: #04140f; background: var(--mint); border-color: transparent; box-shadow: 0 0 12px rgba(92,255,231,.4); }
 
      /* result overlay */
      .pump-result-overlay {
        position: absolute; inset: 0; z-index: 20;
        display: grid; place-items: center;
        background: rgba(8, 9, 16, .62);
        backdrop-filter: blur(1.5px);
        animation: pump-overlay-in .18s ease;
        cursor: pointer;
      }
      @keyframes pump-overlay-in { from { opacity: 0; } to { opacity: 1; } }
      .pump-result-overlay.no-anim { animation: none !important; opacity: 1; }
      .pump-result-card {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        padding: 22px 34px; background: #171c2c; border: 1px solid var(--line); border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0,0,0,.45);
        cursor: default;
      }
      .pump-result-card.win { border-color: rgba(92,255,231,.5); }
      .pump-result-card.lose { border-color: rgba(255,110,143,.5); }
      .pump-result-mult { font-family: var(--mono); font-size: 26px; font-weight: 800; color: var(--mint); }
      .pump-result-card.lose .pump-result-mult { color: var(--red); }
      .pump-result-amt { font-family: var(--mono); font-size: 13px; font-weight: 700; }
      .pump-result-amt.win { color: var(--mint); }
      .pump-result-amt.lose { color: #ff9fae; }
 
      /* ---- sidebar: difficulty dropdown ---- */
      .pump-diff-row { position: relative; }
      .pump-diff-toggle {
        display: flex; align-items: center; justify-content: space-between;
        width: 100%; padding: 12px 14px;
        color: var(--text); background: #0c0e18; border: 1px solid var(--line); border-radius: 11px;
        font-size: 13px; font-weight: 700;
      }
      .pump-diff-toggle svg { width: 14px; height: 14px; color: #7c88a0; transition: transform .15s ease; }
      .pump-diff-toggle.open svg { transform: rotate(180deg); }
      .pump-diff-menu {
        position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 12;
        padding: 4px; background: #171b2c; border: 1px solid var(--line); border-radius: 10px;
        box-shadow: 0 14px 30px rgba(0,0,0,.4);
      }
      .pump-diff-menu button {
        display: flex; justify-content: space-between; width: 100%; padding: 9px 10px; color: #b6bfd2; background: transparent;
        border: 0; border-radius: 7px; font-size: 12.5px; font-weight: 700; text-align: left;
      }
      .pump-diff-menu button span.dsub { color: #69758c; font-family: var(--mono); font-size: 10px; font-weight: 700; }
      .pump-diff-menu button:hover { background: rgba(255,255,255,.06); color: #fff; }
      .pump-diff-menu button.active { color: #04140f; background: var(--mint); }
      .pump-diff-menu button.active span.dsub { color: rgba(4,20,15,.6); }
 
      .pump-netgain-box {
        display: flex; align-items: center; justify-content: space-between;
        margin-top: 12px; padding: 12px 14px;
        color: var(--mint); background: #0c0e18; border: 1px solid var(--line); border-radius: 11px;
        font-family: var(--mono); font-size: 14px; font-weight: 800;
      }
      .pump-netgain-label { color: #8791a6; font-size: 11px; font-weight: 700; margin: 14px 0 8px; }
 
      .pump-btn {
        width: 100%; margin-top: 10px; padding: 14px 0;
        color: #fff; background: linear-gradient(120deg, #5c7dff, #3aa0ff);
        border: 0; border-radius: 12px; font-size: 13px; font-weight: 800;
        box-shadow: 0 10px 26px rgba(58,160,255,.28);
      }
      .pump-btn:disabled { color: #6c7488; background: #1b2032; box-shadow: none; }
      .pump-cashout-btn {
        width: 100%; margin-top: 8px; padding: 14px 0; color: #04140f;
        background: linear-gradient(120deg, #38d787, #63f0ab); border: 0; border-radius: 12px;
        font-size: 13px; font-weight: 800;
      }
      .pump-cashout-btn:disabled { color: #6c7488; background: #1b2032; }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <div class="site-grid">
        <div id="site-sidebar"></div>
        <div id="site-topbar"></div>
        <div id="page-content"></div>
      </div>
    </div>
    <script src="./promo-vault.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="./chat.js"></script>
    <script src="./shell.js"></script>
    <script src="./games.js"></script>
    <script>
      (() => {
        const GAME_NAME = "Pump";
        const GAME_ID = "pump";
 
        Shell.mount({ activeTab: "Games" });
        Chat.mount();
        document.addEventListener("nj:animations", (e) => { state.settings.animations = !e.detail; render(); });
        const content = document.getElementById("page-content");
        const svg = Shell.svg;
 
        // ---------------------------------------------------------------
        // MATH — 25 pumps to max win on every difficulty. RTP 98%. Each
        // difficulty's per-pump survival probability follows a geometric
        // curve (p0 * r^n) solved so that (a) the multiplier after the 3rd
        // pump matches a "slow start" target, and (b) the multiplier after
        // the 25th (final) pump matches that difficulty's published max
        // multiplier — giving the "slow climb early, explosive late" feel
        // described in the spec without needing a hand-tuned table.
        // ---------------------------------------------------------------
        const RTP = 0.98;
        const MAX_PUMPS = 25;
        const DIFFICULTIES = {
          easy:   { label: "Easy",   maxMult: 24.50,      mult3: 1.07 },
          medium: { label: "Medium", maxMult: 2254.00,    mult3: 1.474 },
          hard:   { label: "Hard",   maxMult: 52067.40,   mult3: 2.032 },
          expert: { label: "Expert", maxMult: 3203384.80, mult3: 2.80 },
        };
 
        const tableCache = {};
        function buildTable(diffKey) {
          if (tableCache[diffKey]) return tableCache[diffKey];
          const cfg = DIFFICULTIES[diffKey];
          const product3 = RTP / cfg.mult3;
          const product25 = RTP / cfg.maxMult;
          const lnX = Math.log(product3) / 3;
          const lnR = (Math.log(product25) - 25 * lnX) / 275;
          const lnP0 = lnX - lnR;
          const p0 = Math.exp(lnP0);
          const r = Math.exp(lnR);
          const probs = [];
          for (let n = 0; n < MAX_PUMPS; n++) probs.push(Math.max(0.015, Math.min(0.995, p0 * Math.pow(r, n))));
          let cum = 1;
          const mults = [];
          for (let i = 0; i < MAX_PUMPS; i++) {
            cum *= probs[i];
            let m = RTP / cum;
            m = Math.floor(m * 100) / 100;
            if (m < 1) m = 1;
            mults.push(m);
          }
          mults[MAX_PUMPS - 1] = cfg.maxMult; // pin the displayed max exactly to the published value
          const out = { probs, mults };
          tableCache[diffKey] = out;
          return out;
        }
        function multiplierAt(diffKey, pumps) {
          if (pumps <= 0) return 1;
          const t = buildTable(diffKey);
          return t.mults[Math.min(pumps, MAX_PUMPS) - 1];
        }
 
        // ---------------------------------------------------------------
        // sound
        // ---------------------------------------------------------------
        let audioCtx = null;
        const getCtx = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; };
        function playPumpSound(volumePct) {
          const v = volumePct / 100;
          if (v <= 0) return;
          try {
            const ctx = getCtx();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(420, now + 0.12);
            g.gain.setValueAtTime(0.16 * v, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(g).connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.17);
          } catch {}
        }
        function playPopSound(volumePct) {
          const v = volumePct / 100;
          if (v <= 0) return;
          try {
            const ctx = getCtx();
            const now = ctx.currentTime;
            const dur = 0.32;
            const bufferSize = Math.floor(ctx.sampleRate * dur);
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 0.6);
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const bandpass = ctx.createBiquadFilter();
            bandpass.type = "highpass";
            bandpass.frequency.setValueAtTime(600, now);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.55 * v, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + dur);
            noise.connect(bandpass).connect(g).connect(ctx.destination);
            noise.start(now); noise.stop(now + dur);
          } catch {}
        }
 
        const state = {
          betAmount: "",
          mode: "manual", // "manual" | "auto" (auto isn't implemented in this demo)
          difficulty: "medium",
          diffOpen: false,
          busy: false,
          infoOpen: false,
          fairPlayOpen: false,
          settingsOpen: false,
          statsOpen: false,
          statsGame: "all",
          statsGameDropdownOpen: false,
          statsDrag: null,
          statsPos: null,
          favorite: Shell.getFavorites().includes(GAME_ID),
          settings: { animations: !Shell.isAnimationsDisabled(), volume: 100 },
 
          active: false,
          betAmt: 0,
          pumps: 0,
          popped: false,
          pumping: false, // squish animation flag, cleared right after
          popLabelShown: false, // true once the POP! label has already played its entrance animation once // squish animation flag, cleared right after
          resultOverlayShown: false, // true once the result overlay has already played its entrance animation once
          lastResult: null,
          showResultOverlay: false,
        };
 
        function recordBet(betAmount, result) {
          Shell.addBetEntry({ game: GAME_ID, bet: betAmount, won: result.won, profit: result.profit });
          if (result.won) Shell.addBalance(betAmount + result.profit);
        }
 
        function persistRound() {
          if (!state.active) { Shell.clearActiveRound(GAME_ID); return; }
          Shell.saveActiveRound(GAME_ID, { difficulty: state.difficulty, betAmt: state.betAmt, pumps: state.pumps });
        }
 
        function startRound() {
          if (state.busy || state.active) return;
          const raw = parseFloat(state.betAmount);
          let amt = state.betAmount !== "" && !isNaN(raw) && raw > 0 ? Math.round(raw * 100) / 100 : 0;
          const balance = Shell.getBalance();
          if (amt > 0 && Shell.isBelowMinBet(amt)) { Shell.notify(`Minimum bet is ${Shell.fmtMoney(Shell.MIN_BET)}.`); return; }
          if (amt > 0 && (balance <= 0 || amt > balance)) { Shell.notify("Insufficient balance."); return; }
          amt = Math.min(amt, balance);
 
          if (amt > 0) Shell.addBalance(-amt);
          state.active = true;
          state.betAmt = amt;
          state.pumps = 0;
          state.popped = false;
          state.pumping = false;
          state.lastResult = null;
          state.showResultOverlay = false;
          persistRound();
          render();
        }
 
        function pump() {
          if (state.busy || !state.active || state.popped) return;
          state.busy = true;
          state.pumping = true;
          playPumpSound(state.settings.volume);
          render();
 
          const delay = state.settings.animations ? 260 : 0;
          setTimeout(() => {
            const t = buildTable(state.difficulty);
            const survivalProb = t.probs[state.pumps];
            const survived = Math.random() < survivalProb;
            state.pumping = false;
 
            if (!survived) {
              state.popped = true;
              state.popLabelShown = false;
              playPopSound(state.settings.volume);
              const result = { won: false, profit: -state.betAmt, payout: 0, payoutLabel: "0.00x" };
              recordBet(state.betAmt, result);
              state.lastResult = result;
              state.active = false;
              state.busy = false;
              Shell.clearActiveRound(GAME_ID);
              render();
              setTimeout(() => { state.resultOverlayShown = false; state.showResultOverlay = true; render(); }, state.settings.animations ? 550 : 0);
              return;
            }
 
            state.pumps += 1;
            if (state.pumps >= MAX_PUMPS) {
              state.busy = false;
              cashOut(true);
              return;
            }
            persistRound();
            state.busy = false;
            render();
          }, delay);
        }
 
        function cashOut(auto) {
          if (!state.active || state.pumps < 1) return;
          const mult = multiplierAt(state.difficulty, state.pumps);
          const payout = state.betAmt * mult;
          const result = { won: true, profit: payout - state.betAmt, payout, payoutLabel: `${mult.toFixed(2)}x` };
          recordBet(state.betAmt, result);
          state.lastResult = result;
          state.active = false;
          state.busy = false;
          state.resultOverlayShown = false;
          state.showResultOverlay = true;
          Shell.clearActiveRound(GAME_ID);
          render();
        }
 
        function dismissResultOverlay(e) {
          if (e && e.target.closest(".pump-result-card")) return;
          if (!state.showResultOverlay) return;
          state.showResultOverlay = false;
          render();
        }
 
        // ---------------------------------------------------------------
        // RENDER
        // ---------------------------------------------------------------
        function balloonScale(pumps, active) {
          const DEFLATED = 0.12; // resting size right after betting, before the first pump
          const FIRST_PUMP = 1.00; // size right after the 1st pump — kept close to DEFLATED so 0->1 isn't a huge jump
          const MAX_SCALE = 2.15; // size at the final pump (MAX_PUMPS)
          if (pumps <= 0) return active ? DEFLATED : 1; // idle (no round) = normal size; active round, no pumps yet = deflated
          const p = Math.min(pumps, MAX_PUMPS);
          if (p <= 1) return FIRST_PUMP;
          // From pump 1 onward, grow linearly from FIRST_PUMP up toward MAX_SCALE so every
          // step after the first is a consistent, gradual increase — matching the site's
          // existing "gets bigger every pump" feel, just without the 0->1 spike.
          return FIRST_PUMP + (p - 1) * ((MAX_SCALE - FIRST_PUMP) / (MAX_PUMPS - 1));
        }
 
        function stageHTML() {
          const scale = balloonScale(state.pumps, state.active);
          const mult = state.active ? multiplierAt(state.difficulty, state.pumps) : (state.lastResult ? state.lastResult.payout / (state.betAmt || 1) : 1);
          const displayMult = state.popped ? 0 : mult;
          const balloonCls = ["pump-balloon"];
          if (state.pumping) balloonCls.push("pumping");
          if (state.popped) balloonCls.push("popped");
 
          const t = buildTable(state.difficulty);
          const startCleared = state.active && state.pumps > 0;
          const startCurrent = state.active && state.pumps === 0;
          const startRung = `<div class="pump-ladder-step ${startCleared ? "cleared" : ""} ${startCurrent ? "current" : ""}">1.00x</div>`;
          const ladderHTML = startRung + t.mults.map((m, i) => {
            const stepNum = i + 1;
            const cleared = state.active && stepNum < state.pumps;
            const current = state.active && stepNum === state.pumps;
            return `<div class="pump-ladder-step ${cleared ? "cleared" : ""} ${current ? "current" : ""}">${m.toFixed(2)}x</div>`;
          }).join("");
          if (state.popped) state.popLabelShown = true;
          return `
            <div class="pump-balloon-wrap">
              <div class="pump-ground"></div>
              <div class="pump-string"></div>
              <div class="pump-stand"></div>
              ${!state.popped ? `<div class="${balloonCls.join(" ")}" style="--bscale:${scale};"></div>` : ""}
              ${state.popped ? `<div class="pump-pop-label ${state.popLabelShown ? "no-anim" : ""}">POP!</div>` : ""}
              <div class="pump-mult-readout ${state.popped ? "popped" : ""}">${state.popped ? "0.00x" : displayMult.toFixed(2) + "x"}</div>
              ${state.showResultOverlay && state.lastResult ? resultOverlayHTML(state.lastResult) : ""}
            </div>
            <div class="pump-ladder-wrap"><div class="pump-ladder">${ladderHTML}</div></div>
          `;
        }
 
        function resultOverlayHTML(r) {
          const cls = state.resultOverlayShown ? "pump-result-overlay no-anim" : "pump-result-overlay";
          state.resultOverlayShown = true;
          return `<div class="${cls}" data-result-overlay>
            <div class="pump-result-card ${r.won ? "win" : "lose"}">
              <div class="pump-result-mult">${r.payoutLabel}</div>
              <div class="pump-result-amt ${r.won ? "win" : "lose"}">${r.won ? "+" + Shell.fmtMoney(r.payout) : "-" + Shell.fmtMoney(Math.abs(r.profit))}</div>
            </div>
          </div>`;
        }
 
        function render() {
          const balance = Shell.getBalance();
          const betRaw = parseFloat(state.betAmount);
          const hasBet = state.betAmount !== "" && !isNaN(betRaw) && betRaw > 0;
          const demoMode = !state.active && !hasBet;
          const insufficientBalance = !state.active && hasBet && betRaw > balance;
          const belowMinBet = !state.active && hasBet && Shell.isBelowMinBet(betRaw);
          const canCashOut = state.active && state.pumps >= 1 && !state.busy && !state.popped;
          const canPump = state.active && !state.busy && !state.popped;
          const currentMult = state.active && state.pumps >= 1 ? multiplierAt(state.difficulty, state.pumps) : 1;
          const netGain = state.active ? (state.betAmt * currentMult - state.betAmt) : 0;
 
          content.innerHTML = `
            <div class="game-page">
              <div class="game-shell ${state.settings.animations ? "" : "no-animations"}">
                <div class="shell-grid">
 
                  <header class="title-bar">
                    <button class="game-icon-btn hover-tip" data-hover-tip="Game info" data-info>${svg("safe")}</button>
                    <div class="title-name">${GAME_NAME}</div>
                    <button class="fair-play-btn" data-fair-play>${svg("safe")} Fair Play</button>
                  </header>
 
                  <aside class="sidebar">
                    <div class="mode-toggle">
                      <button class="mode-btn ${state.mode === "manual" ? "active" : ""}" data-mode="manual">Manual</button>
                      <button class="mode-btn ${state.mode === "auto" ? "active" : ""}" data-mode="auto">Auto</button>
                    </div>
 
                    <div class="field-label">Amount</div>
                    <div class="bet-input-row">
                      <span class="prefix">$</span>
                      <input type="text" inputmode="decimal" placeholder="0.00" value="${state.betAmount}" data-bet-input class="${insufficientBalance || belowMinBet ? "error" : ""}" ${state.active ? "disabled" : ""}>
                      <div class="bet-quick">
                        <button data-half ${state.active ? "disabled" : ""}>½</button>
                        <button data-double-bet ${state.active ? "disabled" : ""}>2×</button>
                      </div>
                    </div>
                    ${insufficientBalance ? `<div class="balance-error">Insufficient balance</div>` : ""}
                    ${!insufficientBalance && belowMinBet ? `<div class="balance-error">Minimum bet is ${Shell.fmtMoney(Shell.MIN_BET)}</div>` : ""}
 
                    <div class="field-label">Difficulty</div>
                    <div class="pump-diff-row">
                      <button class="pump-diff-toggle ${state.diffOpen ? "open" : ""}" data-diff-toggle ${state.active ? "disabled" : ""}>
                        <span>${DIFFICULTIES[state.difficulty].label}</span>${svg("chevronDown")}
                      </button>
                      ${state.diffOpen ? `<div class="pump-diff-menu">
                        ${Object.entries(DIFFICULTIES).map(([key, d]) => `<button class="${state.difficulty === key ? "active" : ""}" data-diff-pick="${key}"><span>${d.label}</span><span class="dsub">${d.maxMult.toLocaleString(undefined, { maximumFractionDigits: 2 })}x max</span></button>`).join("")}
                      </div>` : ""}
                    </div>
 
                    ${!state.active ? `
                    <button class="place-bet-btn ${hasBet ? "" : "demo"}" data-place ${insufficientBalance || belowMinBet ? "disabled" : ""} style="margin-top:16px;">
                      ${hasBet ? "Play" : "Play (Demo)"}
                    </button>
                    ${demoMode ? `<div class="demo-hint-wrap"><div class="demo-hint">Enter Bet Amount For Real Play</div></div>` : ""}
                    ` : `
                    <button class="pump-btn" data-pump ${canPump ? "" : "disabled"} style="margin-top:16px;">
                      ${state.popped ? "Popped!" : (state.busy ? "Pumping…" : "Pump")}
                    </button>
                    <button class="pump-cashout-btn" data-cashout ${canCashOut ? "" : "disabled"}>
                      ${canCashOut ? `Cashout — ${Shell.fmtMoney(state.betAmt * currentMult)}` : "Pump at least once"}
                    </button>
                    `}
 
                    <div class="pump-netgain-label">Total Net Gain (${state.active ? currentMult.toFixed(2) : "1.00"}x)</div>
                    <div class="pump-netgain-box"><span>${Shell.fmtMoney(Math.max(0, netGain))}</span>${svg("coin")}</div>
 
                    <div class="sidebar-meta">
                      <div class="sidebar-meta-row"><span>Balance</span><strong>${Shell.fmtMoney(balance)}</strong></div>
                      ${state.active ? `<div class="sidebar-meta-row"><span>Pumps</span><strong>${state.pumps} / ${MAX_PUMPS}</strong></div>` : ""}
                    </div>
                  </aside>
 
                  <section class="game-box pump-stage">
                    ${stageHTML()}
                  </section>
 
                  <footer class="bottom-bar">
                    <div class="bottom-icons">
                      <div style="position:relative;">
                        <button class="bottom-icon-btn ${state.settingsOpen ? "active" : ""}" data-settings-toggle title="Settings">${svg("settings")}</button>
                        ${state.settingsOpen ? `
                        <div class="popover" data-settings-popover>
                          <div class="popover-title">Game Settings</div>
                          <div class="popover-row"><span>Animations</span><button class="switch ${state.settings.animations ? "on" : ""}" data-toggle-setting="animations" ${Shell.isAnimationsDisabled() ? "disabled" : ""}></button></div>
                          <div class="volume-row"><span>Volume — ${state.settings.volume}%</span><input type="range" min="0" max="100" value="${state.settings.volume}" data-volume-slider></div>
                        </div>` : ""}
                      </div>
                      <button class="bottom-icon-btn ${state.favorite ? "fav-on" : ""}" data-fav-toggle title="Favorite">${svg("heart")}</button>
                      <button class="bottom-icon-btn ${state.statsOpen ? "active" : ""}" data-stats-toggle title="Live stats">${svg("activity")}</button>
                    </div>
                    <div class="bottom-logo">Neon Jackpot</div>
                  </footer>
                </div>
 
                ${Shell.statsPanelHTML(state, GAME_ID, GAME_NAME)}
              </div>
            </div>
 
            ${state.infoOpen ? `
            <div class="modal-overlay" data-info-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${GAME_NAME}</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Place your stake and pick a difficulty, then pump the balloon. Each pump raises
                your multiplier — but also carries a chance the balloon pops, losing your stake.
                Cash out any time after your first pump to lock in the current multiplier. Reach
                pump 25 and you're cashed out automatically at the max multiplier.</p>
                <p>Lower difficulties grow slowly but safely; higher difficulties grow explosively
                but pop far more easily. Every difficulty runs at a 98% RTP.</p>
                <div class="modal-stats">
                  ${Object.values(DIFFICULTIES).map((d) => `<div><span>${d.label}</span><strong>${d.maxMult.toLocaleString(undefined, { maximumFractionDigits: 2 })}x</strong></div>`).join("")}
                </div>
              </div>
            </div>` : ""}
 
            ${state.fairPlayOpen ? `
            <div class="modal-overlay" data-fair-play-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${svg("safe")} Fair Play</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Every pump is an independent random roll, using that pump's own survival
                probability for your chosen difficulty. Multipliers are derived directly from the
                cumulative survival probability up to that pump: multiplier = 0.98 ÷ (probability of
                surviving every pump so far). Surviving all 25 pumps pays out the difficulty's
                published max multiplier at a 98% return to player.</p>
              </div>
            </div>` : ""}
          `;
 
          bind();
        }
 
        function refocus(sel) {
          const el = document.querySelector(sel);
          if (el) { el.focus(); const v = el.value; el.value = ""; el.value = v; }
        }
 
        function bind() {
          if (state.showResultOverlay) {
            document.querySelector("[data-result-overlay]")?.addEventListener("click", dismissResultOverlay);
          }
 
          document.querySelectorAll("[data-mode]").forEach((btn) => btn.addEventListener("click", () => {
            if (btn.dataset.mode === "auto") { Shell.notify("Auto betting isn't available in this demo yet."); return; }
            state.mode = btn.dataset.mode;
            render();
          }));
 
          document.querySelector("[data-place]")?.addEventListener("click", startRound);
          document.querySelector("[data-pump]")?.addEventListener("click", pump);
          document.querySelector("[data-cashout]")?.addEventListener("click", () => cashOut(false));
 
          const betInput = document.querySelector("[data-bet-input]");
          betInput?.addEventListener("input", (e) => {
            state.betAmount = e.target.value.replace(/[^0-9.]/g, "");
            render();
            refocus("[data-bet-input]");
          });
          document.querySelector("[data-half]")?.addEventListener("click", () => {
            const b = parseFloat(state.betAmount) || 0;
            state.betAmount = (b / 2).toFixed(2);
            render();
          });
          document.querySelector("[data-double-bet]")?.addEventListener("click", () => {
            const b = parseFloat(state.betAmount) || 0;
            state.betAmount = Math.min(b * 2 || 0, Shell.getBalance()).toFixed(2);
            render();
          });
 
          document.querySelector("[data-diff-toggle]")?.addEventListener("click", (e) => { e.stopPropagation(); state.diffOpen = !state.diffOpen; render(); });
          document.querySelectorAll("[data-diff-pick]").forEach((btn) => btn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (state.active) return;
            state.difficulty = btn.dataset.diffPick;
            state.diffOpen = false;
            render();
          }));
          document.addEventListener("click", (e) => {
            if (state.diffOpen && !e.target.closest(".pump-diff-row")) { state.diffOpen = false; render(); }
          }, { once: true });
 
          document.querySelector("[data-info]")?.addEventListener("click", () => { state.infoOpen = true; render(); });
          document.querySelector("[data-fair-play]")?.addEventListener("click", () => { state.fairPlayOpen = true; render(); });
          document.querySelectorAll("[data-modal-close]").forEach((btn) => btn.onclick = () => { state.infoOpen = false; state.fairPlayOpen = false; render(); });
          document.querySelector("[data-info-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.infoOpen = false; render(); } });
          document.querySelector("[data-fair-play-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.fairPlayOpen = false; render(); } });
 
          document.querySelector("[data-settings-toggle]")?.addEventListener("click", () => { state.settingsOpen = !state.settingsOpen; render(); });
          document.querySelector("[data-toggle-setting]")?.addEventListener("click", (e) => {
            const key = e.currentTarget.dataset.toggleSetting;
            state.settings[key] = !state.settings[key];
            render();
          });
          document.querySelector("[data-volume-slider]")?.addEventListener("input", (e) => { state.settings.volume = parseInt(e.target.value, 10); });
 
          document.querySelector("[data-fav-toggle]")?.addEventListener("click", () => {
            Shell.toggleFavorite(GAME_ID);
            state.favorite = Shell.getFavorites().includes(GAME_ID);
            render();
          });
 
          document.querySelector("[data-stats-toggle]")?.addEventListener("click", () => { state.statsOpen = !state.statsOpen; render(); });
          Shell.bindStatsPanel(state, render);
 
          document.addEventListener("click", (e) => {
            if (state.settingsOpen && !e.target.closest("[data-settings-popover]") && !e.target.closest("[data-settings-toggle]")) {
              state.settingsOpen = false; render();
            }
          }, { once: true });
        }
 
        Shell.attachStatsPanelDrag(state, render);
 
        (function restoreRound() {
          const saved = Shell.loadActiveRound(GAME_ID);
          if (!saved) return;
          state.difficulty = saved.difficulty || state.difficulty;
          state.betAmt = saved.betAmt;
          state.pumps = saved.pumps || 0;
          state.active = true;
          state.popped = false;
          state.lastResult = null;
          state.showResultOverlay = false;
        })();
 
        render();
      })();
    </script>
  </body>
</html>
