<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Neon Jackpot fictional arcade demo — Incremental" />
    <title>Incremental · Neon Jackpot</title>
    <link rel="stylesheet" href="./shell.css" />
    <style>
      .content { max-width: 900px; margin: auto; padding: 34px 32px 60px; }
      .intro { margin-bottom: 24px; }
      .eyebrow { display: flex; align-items: center; gap: 8px; color: #ff5c9f; font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
      .eyebrow i { width: 25px; height: 1px; background: #ff5c9f; }
      h1 { max-width: 580px; margin: 10px 0 0; font-size: clamp(26px, 3.4vw, 38px); font-weight: 800; letter-spacing: -.05em; line-height: 1; }
      h1 em { color: var(--mint); font-style: normal; }

      .earn-tabs { display: flex; gap: 6px; padding: 4px; margin-bottom: 20px; background: #0c0e18; border: 1px solid var(--line); border-radius: 12px; max-width: 420px; }
      .earn-tab { flex: 1; padding: 10px 0; color: #7c88a0; background: transparent; border: 0; border-radius: 9px; font-size: 12px; font-weight: 800; }
      .earn-tab.active { color: #04140f; background: #3aa0ff; box-shadow: 0 0 16px rgba(58,160,255,.4); }

      .earn-panel { display: none; }
      .earn-panel.active { display: block; }

      .earn-page-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
      .earn-click-card { padding: 28px; background: #121522; border: 1px solid var(--line); border-radius: 16px; text-align: center; }
      .earn-click-zone { display: grid; place-items: center; margin: 10px 0 22px; }
      .earn-click-btn { position: relative; display: grid; place-items: center; width: 180px; height: 180px; color: #04140f; background: radial-gradient(circle at 35% 30%, #8bffd8, var(--mint) 60%, #27ffac); border: 0; border-radius: 50%; font-size: 14px; font-weight: 800; box-shadow: 0 0 0 8px rgba(52, 252, 169, 0.12), 0 18px 46px rgba(92, 255, 187, 0.32); transition: transform .08s ease; user-select: none; }
      .earn-click-btn:active { transform: scale(.96); }
      .earn-click-btn small { display: block; margin-top: 6px; font-family: var(--mono); font-size: 11px; font-weight: 700; }
      .earn-float { position: absolute; color: var(--red); font-weight: 800; font-size: 13px; pointer-events: none; animation: earn-float-up .8s ease forwards; }
      @keyframes earn-float-up { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -46px); } }

      .earn-passive-box { padding: 18px; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px; }
      .earn-passive-row { display: flex; justify-content: space-between; padding: 8px 4px; font-size: 12px; color: #b6bfd2; }
      .earn-passive-row strong { color: #e7edf3; font-family: var(--mono); }
      .earn-claim-btn { width: 100%; margin-top: 8px; padding: 12px 0; color: #04140f; background: linear-gradient(120deg, #d79238, #f0d663); border: 0; border-radius: 10px; font-size: 12px; font-weight: 800; }
      .earn-claim-btn:disabled { color: #6c7488; background: #1b2032; }

      .earn-side-title { margin: 0 0 12px; font-size: 13px; font-weight: 800; color: #dbe1ec; }
      .earn-upgrades { display: grid; gap: 8px; }
      .earn-upgrade { display: flex; align-items: center; gap: 11px; padding: 12px; background: #121522; border: 1px solid var(--line); border-radius: 12px; }
      .earn-upgrade-icon { display: grid; place-items: center; width: 34px; height: 34px; flex: none; color: var(--mint); background: rgba(92,255,231,.08); border-radius: 9px; }
      .earn-upgrade-icon svg { width: 15px; height: 15px; }
      .earn-upgrade-body { flex: 1; min-width: 0; }
      .earn-upgrade-body strong { display: block; font-size: 11.5px; }
      .earn-upgrade-body span { color: #69758c; font-size: 9.5px; }
      .earn-upgrade-buy { padding: 8px 10px; color: #04140f; background: var(--mint); border: 0; border-radius: 8px; font-size: 10px; font-weight: 800; flex: none; }
      .earn-upgrade-buy:disabled { color: #6c7488; background: #1b2032; }
      .earn-upgrade.maxed { opacity: .68; }
      .earn-upgrade.maxed .earn-upgrade-buy { color: #8791a6; background: #171b2c; }
      .earn-click-btn.earn-click-capped { animation: earn-capped-shake .28s ease; box-shadow: 0 0 0 8px rgba(255,92,159,.25), 0 18px 46px rgba(255,92,159,.3); }
      @keyframes earn-capped-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
      .earn-cap-note { margin-top: 8px; color: #69758c; font-size: 10.5px; text-align: center; }

      @media (max-width: 820px) { .earn-page-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <div class="site-grid">
        <div id="site-sidebar"></div>
        <div id="site-topbar"></div>
        <div id="page-content"></div>
      </div>
    </div>
    <script src="./promo-vault.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="./chat.js"></script>
    <script src="./shell.js"></script>
    <script src="./games.js"></script>
    <script>
      (() => {
        Shell.mount({ activeTab: "Incremental" });
        Chat.mount();
        const content = document.getElementById("page-content");
        const svg = Shell.svg;
        let tab = "click";
        let tickTimer = null;

        function paint() {
          const state = Shell.earnTick();
          const clickVal = Shell.earnClickValue(state);
          const rate = Shell.earnPassiveRate(state);

          content.innerHTML = `<div class="content">
            <div class="intro"><div class="eyebrow"><i></i> Incremental</div><h1>Tap, upgrade, <em>stack up.</em></h1></div>
            <div class="earn-tabs">
              <button class="earn-tab ${tab === "click" ? "active" : ""}" data-earn-tab="click">Click</button>
              <button class="earn-tab ${tab === "clicker" ? "active" : ""}" data-earn-tab="clicker">Clicker Upgrades</button>
              <button class="earn-tab ${tab === "automation" ? "active" : ""}" data-earn-tab="automation">Automation</button>
            </div>

            <div class="earn-panel ${tab === "click" ? "active" : ""}">
              <div class="earn-page-grid">
                <div class="earn-click-card">
                  <div class="earn-click-zone"><button class="earn-click-btn" data-earn-click>CLICK NEEGY<small>+${Shell.fmtMoney(clickVal)} / click</small></button></div>
                  <div class="earn-cap-note">Max ~12 clicks/sec</div>
                </div>
                <div class="earn-passive-box">
                  <div class="earn-passive-row"><span>Passive rate</span><strong>${rate > 0 ? Shell.fmtMoney(rate) + "/sec" : "None yet"}</strong></div>
                  <div class="earn-passive-row"><span>Unclaimed</span><strong>${Shell.fmtMoney(state.pendingPassive || 0)}</strong></div>
                  <button class="earn-claim-btn" data-earn-claim ${(state.pendingPassive || 0) >= 0.01 ? "" : "disabled"}>Claim earnings</button>
                </div>
              </div>
            </div>

            <div class="earn-panel ${tab === "clicker" ? "active" : ""}">
              <h3 class="earn-side-title">Clicker Upgrades</h3>
              <div class="earn-upgrades">${upgradeListHTML(state, "clicker")}</div>
            </div>

            <div class="earn-panel ${tab === "automation" ? "active" : ""}">
              <h3 class="earn-side-title">Automation Upgrades</h3>
              <div class="earn-upgrades">${upgradeListHTML(state, "automation")}</div>
            </div>
          </div>`;

          content.querySelectorAll("[data-earn-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.earnTab; paint(); });
          const clickBtn = content.querySelector("[data-earn-click]");
          if (clickBtn) clickBtn.onclick = (e) => {
            const value = Shell.earnClick();
            if (!value) {
              clickBtn.classList.remove("earn-click-capped"); void clickBtn.offsetWidth;
              clickBtn.classList.add("earn-click-capped");
              return;
            }
            Shell.playChipSound("select");
            const float = document.createElement("span");
            float.className = "earn-float";
            float.textContent = "+" + Shell.fmtMoney(value);
            const rect = clickBtn.getBoundingClientRect();
            float.style.left = (e.clientX - rect.left) + "px";
            float.style.top = (e.clientY - rect.top) + "px";
            clickBtn.style.position = "relative";
            clickBtn.appendChild(float);
            setTimeout(() => float.remove(), 820);
            // Deliberately do NOT call the full paint() here. paint() calls Shell.earnTick(),
            // which accrues passive earnings based on real elapsed time since the last tick —
            // that accrual must only ever happen on the 1s interval timer, never as a side
            // effect of clicking. Calling earnTick() on every click was resetting lastTick
            // early and made the "Unclaimed" passive number visibly jump on every click, which
            // looked like (and functionally was) clicking also crediting passive income.
            // Instead, just refresh the click-value label — nothing else on this panel changes
            // from a click (upgrade costs, passive rate, and unclaimed total are all untouched).
            const small = clickBtn.querySelector("small");
            if (small) small.textContent = "+" + Shell.fmtMoney(Shell.earnClickValue(Shell.getEarnState())) + " / click";
          };

          const claimBtn = content.querySelector("[data-earn-claim]");
          if (claimBtn) claimBtn.onclick = () => {
            const amount = Shell.earnClaimPassive();
            if (amount > 0) {
              Shell.notify(`Claimed ${Shell.fmtMoney(amount)} in passive earnings.`);
              Shell.addNotification({ type: "earnings", title: "Earnings claimed", detail: `+${Shell.fmtMoney(amount)} added to your balance.` });
            }
            paint();
          };
          content.querySelectorAll("[data-earn-buy]").forEach((b) => b.onclick = () => {
            if (Shell.earnBuyUpgrade(b.dataset.earnBuy)) { Shell.playChipSound("select"); paint(); }
          });
        }

        function upgradeListHTML(state, category) {
          return Shell.EARN_UPGRADES.filter((u) => u.category === category).map((u) => {
            const lvl = state.levels[u.id] || 0;
            const maxed = Shell.earnUpgradeMaxed(u.id);
            const cost = Shell.earnUpgradeCost(u.id);
            const affordable = !maxed && cost != null && Shell.getCashBalance() >= cost;
            return `<div class="earn-upgrade ${maxed ? "maxed" : ""}">
              <div class="earn-upgrade-icon">${svg(u.icon)}</div>
              <div class="earn-upgrade-body"><strong>${u.name} ${lvl ? `· Lv ${lvl}${u.maxLevel ? `/${u.maxLevel}` : ""}` : ""}</strong><span>${u.desc}</span></div>
              <button class="earn-upgrade-buy" data-earn-buy="${u.id}" ${(affordable && !maxed) ? "" : "disabled"}>${maxed ? "MAX" : Shell.fmtMoney(cost)}</button>
            </div>`;
          }).join("");
        }

        paint();
        tickTimer = setInterval(paint, 1000);
        window.addEventListener("beforeunload", () => clearInterval(tickTimer));
      })();
    </script>
  </body>
</html>
