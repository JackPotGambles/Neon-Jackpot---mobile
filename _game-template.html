<!doctype html>
<!--
  ============================================================================
  _GAME-TEMPLATE.HTML — starting point for every new Neon Jackpot game
  ============================================================================
  HOW TO USE THIS (for a human or an AI filling it in):

  1. Copy this file to ./<gameid>.html (e.g. ./dice.html).
  2. Fill in the four placeholders marked with «ALL CAPS LIKE THIS».
  3. Read GAME_SPEC.md next to this file — it has a fill-in-the-blanks form.
     Answer that form, hand the answers + this file to an AI, and say:
     "Fill in _game-template.html using this spec, output the finished file."
     That's it — you don't need to explain the shell, the bet log, the sidebar,
     modals, or the stats panel every time. This file already wires all of
     that up correctly; the AI only needs to write the actual game logic that
     goes in the game-box + sidebar controls.
  4. Add the new game to games.js (GAME_CATALOG array) so it shows up in the
     lobby, search, and sidebar. Set available: true once it's playable.

  WHAT THIS TEMPLATE ALREADY HANDLES FOR YOU (do not reinvent these):
    - The shared topbar/sidebar shell (Shell.mount)
    - Balance read/write (Shell.getBalance / addBalance)
    - Placing a bet + recording the result (Shell.addBetEntry) — this is what
      drives rank progress, the wager case, rakeback, and the bets/stats pages,
      so EVERY winning or losing round must call recordBet() below.
    - The bet-input + quick-chip row (game-frame.css .bet-input-row / .chip-row)
    - Fair-play / info modals, live-stats popover, settings popover
    - Sound on bet placement (Shell.playChipSound)

  WHAT YOU (or the AI) NEED TO WRITE:
    - GAME_NAME, GAME_ID (must match the filename and the games.js catalog id)
    - The actual round logic: what happens when the player places a bet, what
      the win condition is, and what multiplier/payout results
    - The visual "stage" inside .game-box (the sidebar/controls-panel/bottom-
      bar markup below is a working starting point — restyle freely)
  ============================================================================
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Neon Jackpot fictional arcade demo — «GAME NAME»" />
    <title>«GAME NAME» · Neon Jackpot</title>
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./game-frame.css" />
    <style>
      /* ===== game-specific "stage" styling goes here. ==================
         Everything needed for the outer cabinet/sidebar/bottom bar/modals
         already comes from game-frame.css — only style what's unique to
         this game's play area (.game-box) and any extra sidebar fields. */

      .game-box.template-stage {
        display: grid;
        place-items: center;
        min-height: 380px;
        background: linear-gradient(160deg, #182d42, #16203d 56%, #321849);
      }
      .template-stage-readout {
        padding: 22px 30px;
        color: #eef3f8;
        background: rgba(255,255,255,.04);
        border: 1px solid var(--line);
        border-radius: 16px;
        font-family: var(--mono);
        font-size: 34px;
        font-weight: 800;
        text-align: center;
      }
      .template-stage-readout small {
        display: block;
        margin-top: 6px;
        color: #8791a6;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .04em;
        text-transform: uppercase;
      }
      .template-result-banner {
        margin-top: 16px;
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
      }
      .template-result-banner.win { color: #04140f; background: var(--mint); }
      .template-result-banner.lose { color: #fff; background: var(--red); }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <div class="site-grid">
        <div id="site-sidebar"></div>
        <div id="site-topbar"></div>
        <div id="page-content"></div>
      </div>
    </div>
    <script src="./promo-vault.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="./chat.js"></script>
    <script src="./shell.js"></script>
    <script src="./games.js"></script>
    <script>
      (() => {
        // ---------------------------------------------------------------
        // 1) IDENTITY — must match the games.js catalog entry + filename
        // ---------------------------------------------------------------
        const GAME_NAME = "«GAME NAME»";   // shown in the title bar / modals
        const GAME_ID   = "«gameid»";      // e.g. "dice" — used for bet-log entries

        // SAFETY GUARD — this file is a template, not a real game page, and must never
        // ship as-is. If it's ever opened directly in a browser before GAME_ID has been
        // filled in, don't let it silently log bet entries under the literal placeholder
        // string "«gameid»" — that pollutes the shared bet log / live-stats graph for
        // every other game page on the site permanently (localStorage is shared across
        // all pages on the same origin). Bail out loudly instead.
        if (GAME_ID === "«gameid»" || GAME_NAME === "«GAME NAME»") {
          document.title = "Unconfigured template — do not deploy";
          document.body.innerHTML = `<div style="max-width:640px;margin:80px auto;padding:28px;font:14px/1.6 system-ui;color:#eee;background:#1a1a1a;border-radius:12px;">
            <h2 style="margin-top:0;">This is _game-template.html</h2>
            <p>It still has its placeholder GAME_NAME/GAME_ID — this file is a starting
            point for building a new game, not a page meant to be opened directly.</p>
            <p>Fill in the identity section (and the rest of the game logic) using
            <code>GAME_SPEC.md</code>, save the result as its own <code>&lt;gameid&gt;.html</code>,
            and make sure this template file itself is never linked from the site or
            left on the server where players could reach it.</p>
          </div>`;
          throw new Error("_game-template.html opened with unfilled placeholders — aborting before any bet logic can run.");
        }

        Shell.mount({ activeTab: "Games" });
        Chat.mount();
        document.addEventListener("nj:animations", (e) => { state.settings.animations = !e.detail; render(); });
        const content = document.getElementById("page-content");
        const svg = Shell.svg;

        // ---------------------------------------------------------------
        // 2) STATE — add whatever fields your game logic needs
        // ---------------------------------------------------------------
        const state = {
          betAmount: "1.00",
          selectedChip: null,
          busy: false,           // true while a round is animating/resolving
          lastResult: null,      // { won, profit, payoutLabel } or null
          infoOpen: false,
          fairPlayOpen: false,
          settingsOpen: false,
          statsOpen: false,
          statsGame: "all",
          statsGameDropdownOpen: false,
          statsDrag: null,  // { offsetX, offsetY } while the stats panel is being dragged
          statsPos: null,   // { left, top } once the player has dragged it at least once
          favorite: Shell.getFavorites().includes(GAME_ID),
          settings: { animations: !Shell.isAnimationsDisabled(), volume: 100 },
        };

        // ---------------------------------------------------------------
        // 3) ROUND LOGIC — replace playRound() with your real game rules.
        //    This stub is a 50/50 coin-flip that pays 1.96x on a win, purely
        //    so the template is playable/testable out of the box.
        // ---------------------------------------------------------------
        function playRound(betAmount) {
          const won = Math.random() < 0.5;
          const payoutMult = 1.96;
          const profit = won ? betAmount * (payoutMult - 1) : -betAmount;
          return { won, profit, payoutLabel: won ? `${payoutMult.toFixed(2)}x` : "0.00x" };
        }

        // Every settled round — win OR lose — MUST call this exactly once.
        // This is what drives rank progress, rakeback, the wager case, and
        // the bets/live-stats pages. Never skip it, and never call it more
        // than once per round.
        function recordBet(betAmount, result) {
          Shell.addBetEntry({ game: GAME_ID, bet: betAmount, won: result.won, profit: result.profit });
          Shell.addBalance(result.profit);
        }

        function placeBet() {
          if (state.busy) return;
          const amt = Math.round((parseFloat(state.betAmount) || 0) * 100) / 100;
          if (!(amt > 0)) return;
          if (amt > Shell.getBalance()) { Shell.notify("Insufficient balance."); return; }

          state.busy = true;
          state.lastResult = null;
          render();
          Shell.playChipSound("place", state.settings.volume);

          // Replace this setTimeout with your real animation/reveal timing.
          setTimeout(() => {
            const result = playRound(amt);
            recordBet(amt, result);
            state.lastResult = result;
            state.busy = false;
            render();
          }, 500);
        }

        // ---------------------------------------------------------------
        // 4) RENDER — the cabinet/sidebar/bottom-bar shell below is a
        //    working starting point. Swap out .template-stage for your
        //    game's real visuals; keep the sidebar bet-input pattern.
        // ---------------------------------------------------------------
        function render() {
          const balance = Shell.getBalance();
          const insufficientBalance = (parseFloat(state.betAmount) || 0) > balance;
          const r = state.lastResult;

          content.innerHTML = `
            <div class="game-page">
              <div class="game-shell">
                <div class="shell-grid">

                  <header class="title-bar">
                    <button class="game-icon-btn hover-tip" data-hover-tip="Game info" data-info>${svg("safe")}</button>
                    <div class="title-name">${GAME_NAME}</div>
                    <button class="fair-play-btn" data-fair-play>${svg("safe")} Fair Play</button>
                  </header>

                  <aside class="sidebar">
                    <div class="field-label">Bet Amount</div>
                    <div class="bet-input-row">
                      <span class="prefix">$</span>
                      <input type="text" inputmode="decimal" placeholder="0.00" value="${state.betAmount}" data-bet-input class="${insufficientBalance ? "error" : ""}" ${state.busy ? "disabled" : ""}>
                      <div class="bet-quick">
                        <button data-half>½</button>
                        <button data-double-bet>2×</button>
                      </div>
                    </div>
                    ${insufficientBalance ? `<div class="balance-error">Insufficient balance</div>` : ""}

                    <button class="place-bet-btn ${state.busy ? "busy" : ""}" data-place ${state.busy || insufficientBalance || !(parseFloat(state.betAmount) > 0) ? "disabled" : ""}>
                      ${state.busy ? "Rolling…" : "Place Bet"}
                    </button>

                    <div class="sidebar-meta">
                      <div class="sidebar-meta-row"><span>Balance</span><strong>${Shell.fmtMoney(balance)}</strong></div>
                    </div>
                  </aside>

                  <section class="game-box template-stage">
                    <div>
                      <div class="template-stage-readout">
                        ${state.busy ? "…" : (r ? r.payoutLabel : "READY")}
                        <small>${GAME_NAME} stage — replace with your game's visuals</small>
                      </div>
                      ${r ? `<div class="template-result-banner ${r.won ? "win" : "lose"}" style="margin-inline:auto;width:fit-content;">${r.won ? `+${Shell.fmtMoney(r.profit)}` : `-${Shell.fmtMoney(Math.abs(r.profit))}`}</div>` : ""}
                    </div>
                  </section>

                  <footer class="bottom-bar">
                    <div class="bottom-icons">
                      <div style="position:relative;">
                        <button class="bottom-icon-btn ${state.settingsOpen ? "active" : ""}" data-settings-toggle title="Settings">${svg("settings")}</button>
                        ${state.settingsOpen ? `
                        <div class="popover" data-settings-popover>
                          <div class="popover-title">Game Settings</div>
                          <div class="popover-row"><span>Animations</span><button class="switch ${state.settings.animations ? "on" : ""}" data-toggle-setting="animations" ${Shell.isAnimationsDisabled() ? "disabled" : ""}></button></div>
                          <div class="volume-row"><span>Volume — ${state.settings.volume}%</span><input type="range" min="0" max="100" value="${state.settings.volume}" data-volume-slider></div>
                        </div>` : ""}
                      </div>
                      <button class="bottom-icon-btn ${state.favorite ? "fav-on" : ""}" data-fav-toggle title="Favorite">${svg("heart")}</button>
                      <button class="bottom-icon-btn ${state.statsOpen ? "active" : ""}" data-stats-toggle title="Live stats">${svg("activity")}</button>
                    </div>
                    <div class="bottom-logo">Neon Jackpot</div>
                  </footer>
                </div>

                ${Shell.statsPanelHTML(state, GAME_ID, GAME_NAME)}
              </div>
            </div>

            ${state.infoOpen ? `
            <div class="modal-overlay" data-info-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${GAME_NAME}</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Describe how ${GAME_NAME} works here — bet, outcome, payout table, etc.</p>
              </div>
            </div>` : ""}

            ${state.fairPlayOpen ? `
            <div class="modal-overlay" data-fair-play-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${svg("safe")} Fair Play</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Explain the provably-fair / RNG approach for ${GAME_NAME} here.</p>
              </div>
            </div>` : ""}
          `;

          bind();
        }

        // ---------------------------------------------------------------
        // BIND — event wiring. Keep the pattern; add new selectors as needed.
        // ---------------------------------------------------------------
        function refocus(sel) {
          const el = document.querySelector(sel);
          if (el) { el.focus(); const v = el.value; el.value = ""; el.value = v; }
        }

        function bind() {
          document.querySelector("[data-place]")?.addEventListener("click", placeBet);

          const betInput = document.querySelector("[data-bet-input]");
          betInput?.addEventListener("input", (e) => {
            state.betAmount = e.target.value.replace(/[^0-9.]/g, "");
            render();
            refocus("[data-bet-input]");
          });
          document.querySelector("[data-half]")?.addEventListener("click", () => {
            const b = parseFloat(state.betAmount) || 0;
            state.betAmount = (b / 2).toFixed(2);
            render();
          });
          document.querySelector("[data-double-bet]")?.addEventListener("click", () => {
            const b = parseFloat(state.betAmount) || 0;
            state.betAmount = Math.min(b * 2 || 0, Shell.getBalance()).toFixed(2);
            render();
          });

          document.querySelector("[data-info]")?.addEventListener("click", () => { state.infoOpen = true; render(); });
          document.querySelector("[data-fair-play]")?.addEventListener("click", () => { state.fairPlayOpen = true; render(); });
          document.querySelectorAll("[data-modal-close]").forEach((btn) => btn.onclick = () => { state.infoOpen = false; state.fairPlayOpen = false; render(); });
          document.querySelector("[data-info-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.infoOpen = false; render(); } });
          document.querySelector("[data-fair-play-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.fairPlayOpen = false; render(); } });

          document.querySelector("[data-settings-toggle]")?.addEventListener("click", () => { state.settingsOpen = !state.settingsOpen; render(); });
          document.querySelector("[data-toggle-setting]")?.addEventListener("click", (e) => {
            const key = e.currentTarget.dataset.toggleSetting;
            state.settings[key] = !state.settings[key];
            render();
          });
          document.querySelector("[data-volume-slider]")?.addEventListener("input", (e) => { state.settings.volume = parseInt(e.target.value, 10); });

          document.querySelector("[data-fav-toggle]")?.addEventListener("click", () => {
            Shell.toggleFavorite(GAME_ID);
            state.favorite = Shell.getFavorites().includes(GAME_ID);
            render();
          });

          document.querySelector("[data-stats-toggle]")?.addEventListener("click", () => { state.statsOpen = !state.statsOpen; render(); });
          Shell.bindStatsPanel(state, render);

          // click-outside-to-close for the settings popover only (matches site convention:
          // most popovers close on true outside click, but never on a drag-out gesture)
          document.addEventListener("click", (e) => {
            if (state.settingsOpen && !e.target.closest("[data-settings-popover]") && !e.target.closest("[data-settings-toggle]")) {
              state.settingsOpen = false; render();
            }
          }, { once: true });
        }

        // Stats-panel dragging: bound once at the top level (not inside bind(), which reruns
        // every render()) so the panel keeps following the cursor smoothly instead of losing
        // the drag every time the underlying content re-renders.
        Shell.attachStatsPanelDrag(state, render);

        render();
      })();
    </script>
  </body>
</html>
