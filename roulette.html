<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Neon Jackpot fictional arcade demo — Roulette" />
    <title>Roulette · Neon Jackpot</title>
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./game-frame.css" />
    <style>
      /* ===== Roulette uses a fixed left sidebar (chips/controls) + right table area, like the reference design ===== */
      .shell-grid.sidebar-layout { grid-template-columns: 320px 1fr; grid-template-rows: auto 1fr auto; }
      .sidebar-layout .title-bar { grid-column: 1 / 3; grid-row: 1; }
      .sidebar-layout .controls-panel { grid-column: 1; grid-row: 2; }
      .sidebar-layout .game-box { grid-column: 2; grid-row: 2; }
      .sidebar-layout .bottom-bar { grid-column: 1 / 3; grid-row: 3; }

      @media (max-width: 900px) {
        .shell-grid.sidebar-layout { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto; }
        .sidebar-layout .controls-panel { grid-column: 1; grid-row: 2; }
        .sidebar-layout .game-box { grid-column: 1; grid-row: 3; }
        .sidebar-layout .bottom-bar { grid-column: 1; grid-row: 4; }
      }

      /* ================= SIDEBAR ================= */
      .rl-sidebar { display: flex; flex-direction: column; gap: 16px; height: 100%; padding: 20px; background: rgba(9,10,18,.45); border-right: 1px solid var(--line); overflow-y: auto; }

      .mode-tabs { display: flex; gap: 4px; padding: 4px; background: #0c0e18; border: 1px solid var(--line); border-radius: 999px; }
      .mode-tab { flex: 1; padding: 9px 0; color: #7c88a0; background: transparent; border: 0; border-radius: 999px; font-size: 12.5px; font-weight: 800; }
      .mode-tab.active { color: #04140f; background: linear-gradient(120deg, var(--mint), #7ad9ff); }
      .mode-tab:disabled { opacity: .5; }

      .rl-field-label { display: flex; align-items: center; justify-content: space-between; color: #8791a6; font-size: 11.5px; font-weight: 700; }
      .rl-field-label strong { color: var(--mint); font-family: var(--mono); font-size: 12.5px; }

      .rl-chip-row { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px; }
      .rl-chip { background: none; border: 0; padding: 0; cursor: pointer; }
      .rl-chip:disabled { opacity: .4; cursor: not-allowed; }
      .rl-chip-inner { display: grid; place-items: center; width: 46px; height: 46px; color: #fff; border-radius: 50%; border: 3px dashed rgba(255,255,255,.3); font-family: var(--mono); font-size: 11px; font-weight: 800; box-shadow: 0 6px 14px rgba(0,0,0,.35); transition: transform .12s; }
      .rl-chip-inner:hover { transform: translateY(-2px); }
      .rl-chip-inner.selected { border-color: #fff; border-style: solid; transform: translateY(-3px); box-shadow: 0 0 0 3px rgba(92,255,231,.25), 0 6px 14px rgba(0,0,0,.4); }
      .rl-chip:nth-child(1) .rl-chip-inner { background: #cfd3da; color: #1a1d26; }
      .rl-chip:nth-child(2) .rl-chip-inner { background: #d1424f; }
      .rl-chip:nth-child(3) .rl-chip-inner { background: #2f6fd6; }
      .rl-chip:nth-child(4) .rl-chip-inner { background: #2f9e5c; }
      .rl-chip:nth-child(5) .rl-chip-inner { background: #2c2f38; }
      .rl-chip:nth-child(6) .rl-chip-inner { background: #7c3fd6; }

      .rl-total-input { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: #0c0e18; border: 1px solid var(--line); border-radius: 11px; font-family: var(--mono); font-size: 14px; color: var(--text); }
      .rl-total-actions { display: flex; gap: 6px; }
      .rl-total-actions button { padding: 6px 10px; color: #b6bfd2; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 7px; font-size: 11px; font-weight: 800; }
      .rl-total-actions button:hover:not(:disabled) { color: #fff; border-color: rgba(92,255,231,.35); }
      .rl-total-actions button:disabled { opacity: .4; cursor: not-allowed; }

      .rl-play-btn { width: 100%; padding: 15px 0; margin-top: 4px; color: #04140f; background: linear-gradient(120deg, var(--mint), #7ad9ff); border: 0; border-radius: 12px; font-size: 13.5px; font-weight: 800; box-shadow: 0 10px 26px rgba(92,255,231,.22); }
      .rl-play-btn:disabled { color: #6c7488; background: #1b2032; box-shadow: none; cursor: not-allowed; }

      .rl-auto-fields { display: flex; flex-direction: column; gap: 10px; }
      .rl-auto-field label { display: block; margin-bottom: 6px; color: #8791a6; font-size: 10.5px; font-weight: 700; }
      .rl-auto-field input { width: 100%; padding: 10px 11px; color: var(--text); background: #0c0e18; border: 1px solid var(--line); border-radius: 9px; font-size: 12px; font-family: var(--mono); box-sizing: border-box; }
      .rl-auto-info { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; overflow: hidden; background: var(--line); border: 1px solid var(--line); border-radius: 11px; }
      .rl-auto-info div { padding: 9px 12px; background: rgba(16,18,31,.8); }
      .rl-auto-info span { display: block; color: #6d7891; font-family: var(--mono); font-size: 8.5px; text-transform: uppercase; }
      .rl-auto-info strong { display: block; margin-top: 5px; font-size: 13px; }
      .rl-auto-status { text-align: center; font-family: var(--mono); font-size: 11px; color: #8791a6; }

      .rl-sidebar-footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 11px; font-family: var(--mono); font-size: 12px; }
      .rl-sidebar-footer span { color: #69758c; }
      .rl-sidebar-footer strong { color: var(--mint); }

      /* ================= GAME BOX / TABLE ================= */
      .roul-box { display: flex; flex-direction: column; gap: 16px; padding: 26px 26px 18px; background: linear-gradient(160deg, #182d42, #16203d 56%, #321849); }

      .rl-wheel-row { display: flex; align-items: center; justify-content: center; gap: 20px; position: relative; }

      .rl-readout-num { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; font-family: var(--mono); font-size: 16px; font-weight: 800; color: #cdd4e2; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
      .rl-readout-num.filled.red { color: #fff; background: linear-gradient(160deg, #e8384f, #a51d2e); border-color: transparent; }
      .rl-readout-num.filled.black { color: #fff; background: linear-gradient(160deg, #2a2f45, #14161f); border-color: transparent; }
      .rl-readout-num.filled.green { color: #04140f; background: linear-gradient(160deg, #38d787, #1c9d5f); border-color: transparent; }

      /* ---- history box (right of wheel) ---- */
      .rl-history { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 44px; flex: none; }
      .rl-history-label { color: #6d7891; font-family: var(--mono); font-size: 8.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
      .rl-history-list { display: flex; flex-direction: column; gap: 8px; align-items: center; }
      .rl-history-num { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; font-family: var(--mono); font-size: 12.5px; font-weight: 800; color: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.4); flex: none; }
      .rl-history-num.red { background: linear-gradient(160deg, #e8384f, #a51d2e); }
      .rl-history-num.black { background: linear-gradient(160deg, #3a4058, #1c1f2c); }
      .rl-history-num.green { background: linear-gradient(160deg, #38d787, #1c9d5f); color: #04140f; }
      .rl-history-num:first-child { width: 40px; height: 40px; font-size: 15px; box-shadow: 0 4px 12px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.12); }
      .rl-history-num:nth-child(n+2) { opacity: .82; }
      .rl-history-num:nth-child(n+4) { opacity: .55; }

      .rl-wheel-stage { position: relative; width: 240px; height: 240px; flex: none; }
      .rl-wheel { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 12px 30px rgba(0,0,0,.55), inset 0 0 0 7px #241a0c, inset 0 0 0 9px #5a4218, inset 0 0 0 10px #ffcf7d; }
      .rl-wheel-ring { position: absolute; inset: 10px; border-radius: 50%; overflow: hidden; }
      .rl-wheel-numbers { position: absolute; inset: 0; }
      .rl-wheel-num { position: absolute; left: 50%; top: 50%; font-family: var(--mono); font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: none; }

      /* ball layer is rotated purely via JS (rAF loop during a spin); the ball itself is only
         shown once a spin is actually running */
      .rl-ball-layer { position: absolute; inset: 0; pointer-events: none; transform-origin: 50% 50%; }
      .rl-ball { position: absolute; left: 50%; top: 8px; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #b9c1d4); box-shadow: 0 0 6px rgba(255,255,255,.85); opacity: 0; }
      .rl-ball.visible { opacity: 1; }

      .rl-wheel-hub { position: absolute; left: 50%; top: 50%; width: 82px; height: 82px; margin: -41px 0 0 -41px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #232842, #0a0c16 72%); box-shadow: 0 0 0 4px #1b2033, inset 0 0 16px rgba(0,0,0,.65); display: grid; place-items: center; z-index: 4; }
      .rl-wheel-spinner { width: 42px; height: 42px; position: relative; }
      .rl-wheel-spinner.spinning { animation: rl-spin-idle 1s linear infinite; }
      .rl-wheel-spinner::before, .rl-wheel-spinner::after { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 4px; margin-top: -2px; background: linear-gradient(90deg, #7a5a1e, #ffcf7d, #7a5a1e); border-radius: 2px; }
      .rl-wheel-spinner::after { transform: rotate(90deg); }
      .rl-wheel-spinner .dot { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #ffcf7d; box-shadow: 0 0 8px rgba(255,207,125,.8); }
      @keyframes rl-spin-idle { to { transform: rotate(360deg); } }

      .rl-status-label { text-align: center; color: #8791a6; font-size: 12.5px; font-weight: 700; }
      .rl-status-label strong { color: var(--mint); }

      /* ---- betting table ---- */
      .rl-table { display: flex; gap: 7px; }
      .rl-zero { flex: 0 0 50px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(160deg, #38d787, #1c9d5f); color: #04140f; font-family: var(--mono); font-weight: 800; font-size: 18px; cursor: pointer; position: relative; border: 1px solid rgba(255,255,255,.14); min-height: 56px; }
      .rl-zero:hover { filter: brightness(1.12); }
      .rl-zero.winner { box-shadow: 0 0 0 3px #ffcf7d, 0 0 14px rgba(255,207,125,.6); z-index: 2; }
      .rl-grid { flex: 1; display: flex; flex-direction: column; gap: 7px; }
      .rl-num-row { display: grid; grid-template-columns: repeat(12, 1fr) 54px; gap: 7px; }
      .rl-cell { position: relative; display: grid; place-items: center; border-radius: 10px; font-family: var(--mono); font-weight: 800; font-size: 14.5px; color: #fff; cursor: pointer; border: 1px solid rgba(255,255,255,.1); user-select: none; min-height: 46px; }
      .rl-cell.red { background: linear-gradient(160deg, #e8384f, #a51d2e); }
      .rl-cell.black { background: linear-gradient(160deg, #2a2f45, #14161f); }
      .rl-cell:hover { filter: brightness(1.15); }
      .rl-cell.winner { box-shadow: 0 0 0 3px #ffcf7d, 0 0 14px rgba(255,207,125,.6); z-index: 2; }
      .rl-col2to1 { position: relative; display: grid; place-items: center; border-radius: 10px; color: #cdd4e2; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 11.5px; font-weight: 800; cursor: pointer; min-height: 46px; }
      .rl-col2to1:hover { border-color: rgba(92,255,231,.35); background: rgba(255,255,255,.07); }
      .rl-col2to1.winner { border-color: #ffcf7d; box-shadow: 0 0 14px rgba(255,207,125,.5); color: #ffe6ae; }

      /* chip sits centered on the tile, drawn like the sidebar chip art (dashed ring + value) */
      .rl-chip-badge { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); display: grid; place-items: center; width: 28px; height: 28px; color: #fff; background: #2c2f38; border-radius: 50%; border: 2.5px dashed rgba(255,255,255,.55); font-family: var(--mono); font-size: 9px; font-weight: 800; box-shadow: 0 3px 8px rgba(0,0,0,.5); z-index: 3; line-height: 1; }
      .rl-chip-badge[data-tier="1"] { background: #cfd3da; color: #1a1d26; border-color: rgba(0,0,0,.28); }
      .rl-chip-badge[data-tier="5"] { background: #d1424f; }
      .rl-chip-badge[data-tier="10"] { background: #2f6fd6; }
      .rl-chip-badge[data-tier="25"] { background: #2f9e5c; }
      .rl-chip-badge[data-tier="100"] { background: #2c2f38; }
      .rl-chip-badge[data-tier="500"] { background: #7c3fd6; }

      .rl-outside-wrap { margin: 7px 62px 0 58px; display: flex; flex-direction: column; gap: 7px; }
      .rl-dozens-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .rl-evens-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
      .rl-outside-cell { position: relative; display: flex; align-items: center; justify-content: center; padding: 16px 0; color: #cdd4e2; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: .02em; }
      .rl-outside-cell:hover { border-color: rgba(92,255,231,.35); background: rgba(255,255,255,.07); }
      .rl-outside-cell.winner { border-color: #ffcf7d; box-shadow: 0 0 14px rgba(255,207,125,.5); color: #ffe6ae; }
      .rl-outside-cell.red { background: linear-gradient(160deg, #e8384f, #a51d2e); border-color: transparent; color: #fff; }
      .rl-outside-cell.black { background: linear-gradient(160deg, #2a2f45, #14161f); border-color: transparent; color: #fff; }

      .rl-actions-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
      .rl-undo-btn, .rl-clear-btn2 { display: flex; align-items: center; gap: 6px; padding: 9px 14px; color: #b6bfd2; background: #171b2c; border: 1px solid var(--line); border-radius: 10px; font-size: 11.5px; font-weight: 800; }
      .rl-undo-btn:hover:not(:disabled), .rl-clear-btn2:hover:not(:disabled) { color: #fff; border-color: rgba(92,255,231,.35); }
      .rl-undo-btn:disabled, .rl-clear-btn2:disabled { opacity: .5; cursor: not-allowed; }

      @media (max-width: 900px) {
        .rl-num-row { grid-template-columns: repeat(12, 1fr) 40px; }
        .rl-wheel-stage { width: 190px; height: 190px; }
        .rl-outside-wrap { margin: 7px 40px 0 48px; }
        .rl-history { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <div class="site-grid">
        <div id="site-sidebar"></div>
        <div id="site-topbar"></div>
        <div id="page-content"></div>
      </div>
    </div>
    <script src="./promo-vault.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="./chat.js"></script>
    <script src="./shell.js"></script>
    <script src="./games.js"></script>
    <script>
      (() => {
        const GAME_NAME = "Roulette";
        const GAME_ID = "roulette";

        Shell.mount({ activeTab: "Games" });
        Chat.mount();
        document.addEventListener("nj:animations", (e) => { state.settings.animations = !e.detail; render(); });
        const content = document.getElementById("page-content");
        const svg = Shell.svg;

        // ---------------------------------------------------------------
        // WHEEL / BOARD DATA — single-zero European wheel.
        // ---------------------------------------------------------------
        const WHEEL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
        const RED_SET = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
        function pocketColor(n) { return n === 0 ? "green" : RED_SET.has(n) ? "red" : "black"; }

        const ROW1 = [3,6,9,12,15,18,21,24,27,30,33,36];  // top row
        const ROW2 = [2,5,8,11,14,17,20,23,26,29,32,35];  // middle row
        const ROW3 = [1,4,7,10,13,16,19,22,25,28,31,34];  // bottom row
        const CHIPS = [1, 5, 10, 25, 100, 500];

        // "To 1" payout odds per the spec — Multiplier = odds + 1 (gross return incl. stake).
        const BET_TYPES = {
          straight:  { n: 1,  mult: 36 },
          dozen:     { n: 12, mult: 3 },
          column:    { n: 12, mult: 3 },
          evenMoney: { n: 18, mult: 2 },
        };

        const OUTSIDE_DEFS = [
          { key: "doz1", label: "1 to 12", type: "dozen", test: (n) => n >= 1 && n <= 12 },
          { key: "doz2", label: "13 to 24", type: "dozen", test: (n) => n >= 13 && n <= 24 },
          { key: "doz3", label: "25 to 36", type: "dozen", test: (n) => n >= 25 && n <= 36 },
          { key: "col1", label: "Column 1", type: "column", test: (n) => n > 0 && n % 3 === 1 },
          { key: "col2", label: "Column 2", type: "column", test: (n) => n > 0 && n % 3 === 2 },
          { key: "col3", label: "Column 3", type: "column", test: (n) => n > 0 && n % 3 === 0 },
          { key: "low",   label: "1 to 18", type: "evenMoney", test: (n) => n >= 1 && n <= 18 },
          { key: "even",  label: "Even",    type: "evenMoney", test: (n) => n > 0 && n % 2 === 0 },
          { key: "red",   label: "Red",     type: "evenMoney", test: (n) => RED_SET.has(n), dot: "red" },
          { key: "black", label: "Black",   type: "evenMoney", test: (n) => n !== 0 && !RED_SET.has(n), dot: "black" },
          { key: "odd",   label: "Odd",     type: "evenMoney", test: (n) => n > 0 && n % 2 === 1 },
          { key: "high",  label: "19 to 36",type: "evenMoney", test: (n) => n >= 19 && n <= 36 },
        ];
        const OUTSIDE_BY_KEY = Object.fromEntries(OUTSIDE_DEFS.map((d) => [d.key, d]));
        const EVEN_MONEY_DISPLAY_ORDER = ["low", "even", "red", "black", "odd", "high"];

        // ---------------------------------------------------------------
        // sound — a soft ball-click rattle during spin, win ding on a hit.
        // ---------------------------------------------------------------
        let audioCtx = null;
        const getCtx = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; };
        function playSpinTick(volumePct) {
          const v = volumePct / 100;
          if (v <= 0) return;
          try {
            const ctx = getCtx();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = "square";
            osc.frequency.setValueAtTime(900, now);
            g.gain.setValueAtTime(0.05 * v, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(g).connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.06);
          } catch {}
        }

        const state = {
          selectedChip: 5,
          mode: "manual", // manual | auto
          busy: false,
          spinning: false,
          infoOpen: false,
          fairPlayOpen: false,
          settingsOpen: false,
          statsOpen: false,
          statsGame: "all",
          statsGameDropdownOpen: false,
          statsDrag: null,
          statsPos: null,
          favorite: Shell.getFavorites().includes(GAME_ID),
          settings: { animations: !Shell.isAnimationsDisabled(), volume: 100 },
          clientSeed: "9f2a-71cd-33be-a04e",

          bets: { straight: {}, outside: {} }, // straight: {num: amount}, outside: {key: amount}
          betHistory: [], // stack of {type, key, amount} for Undo
          lastNumber: null,
          history: [], // most-recent-first list of past winning numbers, capped at 5
          settling: false, // true while the ball is actively spinning toward a result
          rafHandle: null, // current requestAnimationFrame id for the spin loop
          lastResult: null, // { won, profit, payout }

          auto: {
            running: false,
            numSpins: "",
            spinsRemaining: null,
            onWinPct: "",
            onLossPct: "",
            stopOnProfit: "",
            stopOnLoss: "",
            currentProfit: 0,
            lastSpinProfit: 0,
          },
        };

        function totalBetAmount() {
          let sum = 0;
          Object.values(state.bets.straight).forEach((v) => sum += v);
          Object.values(state.bets.outside).forEach((v) => sum += v);
          return Math.round(sum * 100) / 100;
        }

        function addChipToStraight(num) {
          if (state.spinning) return;
          const cur = state.bets.straight[num] || 0;
          state.bets.straight[num] = Math.round((cur + state.selectedChip) * 100) / 100;
          state.betHistory.push({ type: "straight", key: num, amount: state.selectedChip });
          render();
        }
        function addChipToOutside(key) {
          if (state.spinning) return;
          const cur = state.bets.outside[key] || 0;
          state.bets.outside[key] = Math.round((cur + state.selectedChip) * 100) / 100;
          state.betHistory.push({ type: "outside", key, amount: state.selectedChip });
          render();
        }
        function undoLastBet() {
          if (state.spinning) return;
          const last = state.betHistory.pop();
          if (!last) return;
          const bag = last.type === "straight" ? state.bets.straight : state.bets.outside;
          const remaining = Math.round(((bag[last.key] || 0) - last.amount) * 100) / 100;
          if (remaining <= 0.0001) delete bag[last.key];
          else bag[last.key] = remaining;
          render();
        }
        function clearBets() {
          if (state.spinning) return;
          state.bets = { straight: {}, outside: {} };
          state.betHistory = [];
          state.lastNumber = null;
          state.lastResult = null;
          render();
        }
        function scaleAllBets(factor) {
          if (state.spinning || totalBetAmount() <= 0) return;
          Object.keys(state.bets.straight).forEach((k) => {
            state.bets.straight[k] = Math.max(0, Math.round(state.bets.straight[k] * factor * 100) / 100);
          });
          Object.keys(state.bets.outside).forEach((k) => {
            state.bets.outside[k] = Math.max(0, Math.round(state.bets.outside[k] * factor * 100) / 100);
          });
          state.betHistory = [];
          render();
        }

        function resolveSpin(winningNumber) {
          let payout = 0;
          Object.entries(state.bets.straight).forEach(([numStr, amt]) => {
            if (!(amt > 0)) return;
            if (parseInt(numStr, 10) === winningNumber) payout += amt * BET_TYPES.straight.mult;
          });
          Object.entries(state.bets.outside).forEach(([key, amt]) => {
            if (!(amt > 0)) return;
            const def = OUTSIDE_BY_KEY[key];
            if (def && def.test(winningNumber)) payout += amt * BET_TYPES[def.type].mult;
          });
          return Math.round(payout * 100) / 100;
        }

        function buildBetDetail(winningNumber) {
          const cells = [];
          Object.entries(state.bets.straight).forEach(([numStr, amt]) => {
            if (amt > 0) cells.push({ label: `#${numStr}`, red: pocketColor(parseInt(numStr, 10)) === "red" });
          });
          Object.entries(state.bets.outside).forEach(([key, amt]) => {
            if (amt > 0) cells.push({ label: (OUTSIDE_BY_KEY[key] || {}).label || key, red: false });
          });
          return { type: "cards", hands: [{ label: `Landed on ${winningNumber}`, cards: cells }] };
        }

        // ---------------------------------------------------------------
        // SPIN FLOW
        // ---------------------------------------------------------------
        const SPIN_MS = 4600;
        const WHEEL_STEP = 360 / WHEEL_ORDER.length;

        function doSpin() {
          if (state.busy || state.spinning) return;
          const total = totalBetAmount();
          const balance = Shell.getBalance();
          if (total > 0 && total > balance) { Shell.notify("Insufficient balance."); return; }
          if (total > 0 && Shell.isBelowMinBet(total)) { Shell.notify(`Minimum total bet is ${Shell.fmtMoney(Shell.MIN_BET)}.`); return; }

          const winningNumber = WHEEL_ORDER[Math.floor(Math.random() * WHEEL_ORDER.length)];
          if (total > 0) Shell.addBalance(-total);
          state.busy = true;
          state.spinning = true;
          state.lastNumber = null;
          state.lastResult = null;
          render();

          animateWheel(winningNumber, () => {
            const payout = resolveSpin(winningNumber);
            const won = payout > 0;
            const profit = total > 0 ? (payout - total) : 0;
            if (payout > 0) Shell.addBalance(payout);
            if (total > 0) {
              Shell.addBetEntry({ game: GAME_ID, bet: total, won, profit, detail: buildBetDetail(winningNumber) });
            }
            state.lastNumber = winningNumber;
            state.history.unshift(winningNumber);
            if (state.history.length > 5) state.history.length = 5;
            state.lastResult = total > 0 ? { won, profit, payout } : null;
            state.busy = false;
            state.spinning = false;
            if (won) Shell.playWinDing(state.settings.volume);
            render();
          });
        }

        function wheelNumbersHTML(radius) {
          return WHEEL_ORDER.map((num, i) => {
            const angle = i * WHEEL_STEP;
            return `<span class="rl-wheel-num" style="transform: translate(-50%,-50%) rotate(${angle}deg) translateY(-${radius}px);">${num}</span>`;
          }).join("");
        }

        function wheelColorGradient() {
          const stops = WHEEL_ORDER.map((num, i) => {
            const c = pocketColor(num);
            const color = c === "red" ? "#d3183f" : c === "green" ? "#1c9d5f" : "#15171f";
            const start = (i * WHEEL_STEP).toFixed(3);
            const end = ((i + 1) * WHEEL_STEP).toFixed(3);
            return `${color} ${start}deg ${end}deg`;
          });
          return `conic-gradient(from ${(-WHEEL_STEP / 2).toFixed(3)}deg, ${stops.join(",")})`;
        }

        // Ball rim radius (spins near the outer gold ring) vs its resting radius once it drops
        // in next to the numbers.
        const BALL_RIM_RADIUS = 108;
        const BALL_REST_RADIUS = 78;

        // Built exactly once. This node is never recreated or replaced by render() — it's moved
        // (via slot.replaceWith) into a fresh placeholder every render, so nothing about it is
        // ever reset by unrelated UI updates (opening the stats panel, clicking Play, etc).
        //
        // The wheel's number/color ring rotates continuously and slowly at all times (idle rAF
        // loop below), purely for visual flavor. The ball moves on its own independent layer via
        // a separate rAF loop. Because both rotations are driven by real elapsed time (not CSS
        // keyframes), we can always calculate exactly where the wheel ring *will* be at the
        // moment a spin finishes, and land the ball there — so the ball's final resting position
        // always matches the number `resolveSpin()` actually paid out on, no matter how far the
        // wheel has idly rotated in the meantime. No CSS transitions/animations are involved, so
        // there is exactly one source of truth for both the wheel's and the ball's position and
        // no risk of drift or restart glitches across repeated spins.
        const wheelStageEl = document.createElement("div");
        wheelStageEl.className = "rl-wheel-stage";
        wheelStageEl.innerHTML = `
          <div class="rl-wheel" data-wheel>
            <div class="rl-wheel-ring" style="background:${wheelColorGradient()};"></div>
            <div class="rl-wheel-numbers">${wheelNumbersHTML(96)}</div>
          </div>
          <div class="rl-ball-layer" data-ball-layer>
            <div class="rl-ball" data-ball></div>
          </div>
          <div class="rl-wheel-hub"><div class="rl-wheel-spinner" data-spinner><span class="dot"></span></div></div>`;

        function setBallPosition(angleDeg, radius) {
          const ballLayerEl = wheelStageEl.querySelector("[data-ball-layer]");
          const ballEl = wheelStageEl.querySelector("[data-ball]");
          ballLayerEl.style.transform = `rotate(${angleDeg}deg)`;
          ballEl.style.top = `${8 + (BALL_RIM_RADIUS - radius)}px`;
        }

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

        // ---------------------------------------------------------------
        // IDLE WHEEL ROTATION — the ring of colors/numbers turns slowly and
        // continuously, at all times (including mid-spin), independent of the
        // ball. Driven by real elapsed time rather than a CSS animation, so
        // we always know — and can predict ahead of time — exactly what angle
        // the ring is at. That's what lets the ball land on the correct
        // number below instead of drifting out of sync with a CSS-driven spin.
        // ---------------------------------------------------------------
        const WHEEL_REV_MS = 26000; // one full slow rotation every 26s
        const wheelEpoch = performance.now();
        function wheelAngleAt(nowMs) {
          if (!state.settings.animations) return 0; // frozen when animations are off
          return ((nowMs - wheelEpoch) % WHEEL_REV_MS) / WHEEL_REV_MS * 360;
        }
        const wheelRingEl = wheelStageEl.querySelector(".rl-wheel-ring");
        const wheelNumbersEl = wheelStageEl.querySelector(".rl-wheel-numbers");
        (function idleWheelLoop(now) {
          const angle = wheelAngleAt(now);
          const t = `rotate(${angle}deg)`;
          wheelRingEl.style.transform = t;
          wheelNumbersEl.style.transform = t;
          requestAnimationFrame(idleWheelLoop);
        })(performance.now());

        function animateWheel(winningNumber, onDone) {
          const ballEl = wheelStageEl.querySelector("[data-ball]");
          const spinnerEl = wheelStageEl.querySelector("[data-spinner]");
          const idx = WHEEL_ORDER.indexOf(winningNumber);
          // Angle of the winning wedge within the wheel ring's own (rotating) frame.
          const wedgeLocalAngle = idx * WHEEL_STEP;

          if (!state.settings.animations) {
            setTimeout(onDone, 400);
            return;
          }

          state.settling = true;
          ballEl.classList.add("visible");
          spinnerEl.classList.add("spinning");

          const laps = 6; // full rim laps before landing, purely cosmetic
          const start = performance.now();
          // Rather than aim the ball at a fixed angle computed in advance, we track the winning
          // wedge's LIVE screen position every frame (it keeps moving, since the wheel never
          // stops turning) and ease the gap between the ball and that live position down to
          // exactly zero. Because the gap itself is what's easing to zero — not two independently
          // moving things trying to meet at a predicted point — the ball can't overshoot the
          // number and swing back; the final frame is mathematically guaranteed to land exactly
          // on the wedge, whatever the wheel happens to be doing.
          const initialOffset = laps * 360;
          const tickTimer = setInterval(() => playSpinTick(state.settings.volume), 90);

          function frame(now) {
            const t = Math.min(1, (now - start) / SPIN_MS);
            const eased = easeOutCubic(t);
            const wedgeScreenAngleNow = wheelAngleAt(now) + wedgeLocalAngle;
            const angle = wedgeScreenAngleNow + initialOffset * (1 - eased);
            // radius eases from the rim down to resting position over the same duration, so the
            // ball visibly rolls the rim first and only drops in as it slows near the end
            const radius = BALL_RIM_RADIUS - (BALL_RIM_RADIUS - BALL_REST_RADIUS) * eased;
            setBallPosition(angle, radius);
            if (t < 1) {
              state.rafHandle = requestAnimationFrame(frame);
            } else {
              clearInterval(tickTimer);
              state.settling = false;
              spinnerEl.classList.remove("spinning");
              onDone();
            }
          }
          state.rafHandle = requestAnimationFrame(frame);
        }

        // ---------------------------------------------------------------
        // AUTO MODE
        // ---------------------------------------------------------------
        function startAuto() {
          const auto = state.auto;
          const total = totalBetAmount();
          if (total <= 0) { Shell.notify("Place at least one chip before starting auto bet."); return; }
          const balance = Shell.getBalance();
          if (total > balance) { Shell.notify("Insufficient balance."); return; }
          if (Shell.isBelowMinBet(total)) { Shell.notify(`Minimum total bet is ${Shell.fmtMoney(Shell.MIN_BET)}.`); return; }
          const num = parseInt(auto.numSpins, 10);
          auto.spinsRemaining = auto.numSpins.trim() !== "" && !isNaN(num) && num > 0 ? num : null;
          auto.running = true;
          auto.currentProfit = 0;
          auto.lastSpinProfit = 0;
          render();
          runAutoStep();
        }
        function stopAuto() { state.auto.running = false; render(); }

        function runAutoStep() {
          const auto = state.auto;
          if (!auto.running) return;
          if (auto.spinsRemaining !== null && auto.spinsRemaining <= 0) { stopAuto(); return; }
          const total = totalBetAmount();
          if (total <= 0 || total > Shell.getBalance()) { stopAuto(); return; }

          const winningNumber = WHEEL_ORDER[Math.floor(Math.random() * WHEEL_ORDER.length)];
          Shell.addBalance(-total);
          state.busy = true;
          state.spinning = true;
          state.lastNumber = null;
          state.lastResult = null;
          render();

          animateWheel(winningNumber, () => {
            const payout = resolveSpin(winningNumber);
            const won = payout > 0;
            const profit = payout - total;
            if (payout > 0) Shell.addBalance(payout);
            Shell.addBetEntry({ game: GAME_ID, bet: total, won, profit, detail: buildBetDetail(winningNumber) });
            state.lastNumber = winningNumber;
            state.history.unshift(winningNumber);
            if (state.history.length > 5) state.history.length = 5;
            state.lastResult = { won, profit, payout };
            auto.currentProfit += profit;
            auto.lastSpinProfit = profit;
            if (won) Shell.playWinDing(state.settings.volume);

            const pct = won ? (parseFloat(auto.onWinPct) || 0) : (parseFloat(auto.onLossPct) || 0);
            if (pct !== 0) scaleAllBetsQuiet(Math.max(0, 1 + pct / 100));

            if (auto.spinsRemaining !== null) auto.spinsRemaining -= 1;
            state.busy = false;
            state.spinning = false;

            const stopProfit = parseFloat(auto.stopOnProfit);
            const stopLoss = parseFloat(auto.stopOnLoss);
            let shouldStop = false;
            if (!isNaN(stopProfit) && stopProfit > 0 && auto.currentProfit >= stopProfit) shouldStop = true;
            if (!isNaN(stopLoss) && stopLoss > 0 && auto.currentProfit <= -stopLoss) shouldStop = true;
            if (auto.spinsRemaining !== null && auto.spinsRemaining <= 0) shouldStop = true;
            if (totalBetAmount() <= 0) shouldStop = true;

            render();
            if (shouldStop || !auto.running) { stopAuto(); return; }
            setTimeout(runAutoStep, 500);
          });
        }
        function scaleAllBetsQuiet(factor) {
          Object.keys(state.bets.straight).forEach((k) => {
            state.bets.straight[k] = Math.max(0, Math.round(state.bets.straight[k] * factor * 100) / 100);
          });
          Object.keys(state.bets.outside).forEach((k) => {
            state.bets.outside[k] = Math.max(0, Math.round(state.bets.outside[k] * factor * 100) / 100);
          });
          state.betHistory = [];
        }

        // ---------------------------------------------------------------
        // RENDER
        // ---------------------------------------------------------------
        function chipBadge(amt) {
          if (!(amt > 0)) return "";
          // Color the stacked chip like the nearest chip denomination for visual consistency
          // with the sidebar chip tray, rather than a flat generic dot.
          let tier = CHIPS[0];
          for (const c of CHIPS) { if (amt >= c) tier = c; }
          const label = amt >= 1000 ? (amt / 1000).toFixed(1) + "k" : amt;
          return `<span class="rl-chip-badge" data-tier="${tier}">${label}</span>`;
        }

        function historyHTML() {
          const items = state.history.slice(0, 5).map((n) => `<div class="rl-history-num ${pocketColor(n)}">${n}</div>`).join("");
          return `
          <div class="rl-history">
            <div class="rl-history-label">History</div>
            <div class="rl-history-list">${items}</div>
          </div>`;
        }

        function boardHTML() {
          const winning = state.lastNumber;

          const cellHTML = (n) => {
            const amt = state.bets.straight[n] || 0;
            const isWinner = winning === n;
            return `<div class="rl-cell ${pocketColor(n)} ${isWinner ? "winner" : ""}" data-straight="${n}">${n}${chipBadge(amt)}</div>`;
          };
          const colBetHTML = (key) => {
            const d = OUTSIDE_BY_KEY[key];
            const amt = state.bets.outside[key] || 0;
            const isWinner = winning !== null && d.test(winning);
            return `<div class="rl-col2to1 ${isWinner ? "winner" : ""}" data-outside="${key}">2:1${chipBadge(amt)}</div>`;
          };
          const zeroAmt = state.bets.straight[0] || 0;
          const zeroWinner = winning === 0;

          const outsideCellHTML = (d) => {
            const amt = state.bets.outside[d.key] || 0;
            const isWinner = winning !== null && d.test(winning);
            return `<div class="rl-outside-cell ${d.dot || ""} ${isWinner ? "winner" : ""}" data-outside="${d.key}">${d.label}${chipBadge(amt)}</div>`;
          };

          const dozens = OUTSIDE_DEFS.filter((d) => d.type === "dozen");
          const evensOrdered = EVEN_MONEY_DISPLAY_ORDER.map((k) => OUTSIDE_BY_KEY[k]);

          return `
            <div class="rl-table">
              <div class="rl-zero ${zeroWinner ? "winner" : ""}" data-straight="0">0${chipBadge(zeroAmt)}</div>
              <div class="rl-grid">
                <div class="rl-num-row">${ROW1.map(cellHTML).join("")}${colBetHTML("col3")}</div>
                <div class="rl-num-row">${ROW2.map(cellHTML).join("")}${colBetHTML("col2")}</div>
                <div class="rl-num-row">${ROW3.map(cellHTML).join("")}${colBetHTML("col1")}</div>
              </div>
            </div>
            <div class="rl-outside-wrap">
              <div class="rl-dozens-row">${dozens.map(outsideCellHTML).join("")}</div>
              <div class="rl-evens-row">${evensOrdered.map(outsideCellHTML).join("")}</div>
            </div>`;
        }

        function sidebarHTML() {
          const total = totalBetAmount();
          const balance = Shell.getBalance();
          const auto = state.auto;
          const canSpin = !state.busy && !state.spinning && !auto.running && (total === 0 || (total <= balance && !Shell.isBelowMinBet(total)));

          const chipsHtml = CHIPS.map((v) => `
            <button class="rl-chip" data-chip="${v}" ${state.spinning ? "disabled" : ""}>
              <span class="rl-chip-inner ${state.selectedChip === v ? "selected" : ""}">${v}</span>
            </button>`).join("");

          return `
          <div class="rl-sidebar">
            <div class="mode-tabs">
              <button class="mode-tab ${state.mode === "manual" ? "active" : ""}" data-mode="manual" ${auto.running ? "disabled" : ""}>Manual</button>
              <button class="mode-tab ${state.mode === "auto" ? "active" : ""}" data-mode="auto" ${state.spinning ? "disabled" : ""}>Auto</button>
            </div>

            <div>
              <div class="rl-field-label">Chip Value <strong>${Shell.fmtMoney(state.selectedChip)}</strong></div>
              <div class="rl-chip-row" style="margin-top:8px;">${chipsHtml}</div>
            </div>

            ${state.mode === "manual" ? `
              <div>
                <div class="rl-field-label">Total Amount</div>
                <div class="rl-total-input" style="margin-top:8px;">
                  <span>${Shell.fmtMoney(total)}</span>
                  <div class="rl-total-actions">
                    <button data-half ${state.spinning || total <= 0 ? "disabled" : ""}>½</button>
                    <button data-double ${state.spinning || total <= 0 ? "disabled" : ""}>2×</button>
                  </div>
                </div>
              </div>
              <button class="rl-play-btn" data-spin ${canSpin ? "" : "disabled"}>${state.spinning ? "Spinning…" : "Play"}</button>
            ` : `
              <div class="rl-auto-fields">
                <div class="rl-auto-field"><label>Number of Spins</label><input type="text" inputmode="numeric" placeholder="Infinite" value="${auto.numSpins}" data-num-spins ${auto.running ? "disabled" : ""}></div>
                <div class="rl-auto-field"><label>On Win — Adjust %</label><input type="text" inputmode="decimal" placeholder="0.00" value="${auto.onWinPct}" data-win-pct ${auto.running ? "disabled" : ""}></div>
                <div class="rl-auto-field"><label>On Loss — Adjust %</label><input type="text" inputmode="decimal" placeholder="0.00" value="${auto.onLossPct}" data-loss-pct ${auto.running ? "disabled" : ""}></div>
                <div class="rl-auto-field"><label>Stop On Profit</label><input type="text" inputmode="decimal" placeholder="0.00" value="${auto.stopOnProfit}" data-stop-profit ${auto.running ? "disabled" : ""}></div>
                <div class="rl-auto-field"><label>Stop On Loss</label><input type="text" inputmode="decimal" placeholder="0.00" value="${auto.stopOnLoss}" data-stop-loss ${auto.running ? "disabled" : ""}></div>
              </div>
              <div class="rl-auto-info">
                <div><span>Current Profit</span><strong class="${auto.currentProfit >= 0 ? "positive" : "negative"}">${auto.currentProfit >= 0 ? "+$" : "-$"}${Math.abs(auto.currentProfit).toFixed(2)}</strong></div>
                <div><span>Last Spin Profit</span><strong class="${auto.lastSpinProfit >= 0 ? "positive" : "negative"}">${auto.lastSpinProfit >= 0 ? "+$" : "-$"}${Math.abs(auto.lastSpinProfit).toFixed(2)}</strong></div>
              </div>
              <button class="rl-play-btn" data-auto-toggle ${(!auto.running && (state.spinning || totalBetAmount() <= 0)) ? "disabled" : ""}>
                ${auto.running ? "Stop Auto Bet" : "Start Auto Bet"}
              </button>
              ${auto.running ? `<div class="rl-auto-status">${auto.spinsRemaining === null ? "Running…" : `${auto.spinsRemaining} spin${auto.spinsRemaining === 1 ? "" : "s"} remaining`}</div>` : ""}
            `}

          </div>`;
        }

        function render() {
          const r = state.lastResult;
          const winNum = state.lastNumber;
          const total = totalBetAmount();

          // The wheel/ball stage is a persistent DOM subtree (see wheelStageEl below) that is
          // NEVER recreated by innerHTML — it's detached before the rebuild and reinserted into
          // its slot afterward, so an in-flight CSS transition/animation is never interrupted by
          // unrelated re-renders (e.g. opening the live-stats panel, or the render() that fires
          // immediately when Play is clicked).

          content.innerHTML = `
            <div class="game-page">
              <div class="game-shell">
                <div class="shell-grid sidebar-layout">

                  <header class="title-bar">
                    <button class="game-icon-btn hover-tip" data-hover-tip="Game info" data-info>${svg("safe")}</button>
                    <div class="title-name">${svg("rotate")} ${GAME_NAME}</div>
                    <button class="fair-play-btn" data-fair-play>${svg("safe")} Fair Play</button>
                  </header>

                  <div class="controls-panel">${sidebarHTML()}</div>

                  <section class="game-box roul-box">
                    <div class="rl-wheel-row">
                      <div class="rl-readout-num ${winNum !== null ? "filled " + pocketColor(winNum) : ""}">${winNum !== null ? winNum : "—"}</div>
                      <div data-wheel-slot></div>
                      ${historyHTML()}
                    </div>
                    <div class="rl-status-label">
                      ${state.spinning ? "Spinning…" : (r ? (r.won ? `<strong>+${Shell.fmtMoney(r.payout)}</strong> — winner!` : "No winning bets this spin") : (total > 0 ? "Bets placed — hit Play to spin" : "Place your chips, then spin"))}
                    </div>
                    ${boardHTML()}
                    <div class="rl-actions-row">
                      <button class="rl-undo-btn" data-undo ${state.spinning || state.betHistory.length === 0 ? "disabled" : ""}>${svg("rotate")} Undo</button>
                      <button class="rl-clear-btn2" data-clear-bets ${state.spinning || total <= 0 ? "disabled" : ""}>Clear ${svg("rotate")}</button>
                    </div>
                  </section>

                  <footer class="bottom-bar">
                    <div class="bottom-icons">
                      <div style="position:relative;">
                        <button class="bottom-icon-btn ${state.settingsOpen ? "active" : ""}" data-settings-toggle title="Settings">${svg("settings")}</button>
                        ${state.settingsOpen ? `
                        <div class="popover" data-settings-popover>
                          <div class="popover-title">Game Settings</div>
                          <div class="popover-row"><span>Animations</span><button class="switch ${state.settings.animations ? "on" : ""}" data-toggle-setting="animations" ${Shell.isAnimationsDisabled() ? "disabled" : ""}></button></div>
                          <div class="volume-row"><span>Volume — ${state.settings.volume}%</span><input type="range" min="0" max="100" value="${state.settings.volume}" data-volume-slider></div>
                        </div>` : ""}
                      </div>
                      <button class="bottom-icon-btn ${state.favorite ? "fav-on" : ""}" data-fav-toggle title="Favorite">${svg("heart")}</button>
                      <button class="bottom-icon-btn ${state.statsOpen ? "active" : ""}" data-stats-toggle title="Live stats">${svg("activity")}</button>
                    </div>
                    <div class="bottom-logo">Neon Jackpot</div>
                  </footer>
                </div>

                ${Shell.statsPanelHTML(state, GAME_ID, GAME_NAME)}
              </div>
            </div>

            ${state.infoOpen ? `
            <div class="modal-overlay" data-info-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${GAME_NAME}</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Single-zero European Roulette. Pick a chip value, then click numbers or outside
                bets to place chips on the table — stack as many bets as you like. Hit Play and the
                ball settles on one of 37 pockets (0–36). Every bet that covers the winning number
                pays out at its own odds.</p>
                <div class="modal-stats">
                  <div><span>Straight Up</span><strong>36x</strong></div>
                  <div><span>Dozen / Column</span><strong>3x</strong></div>
                  <div><span>Even Money</span><strong>2x</strong></div>
                  <div><span>RTP</span><strong>97.30%</strong></div>
                </div>
              </div>
            </div>` : ""}

            ${state.fairPlayOpen ? `
            <div class="modal-overlay" data-fair-play-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${svg("safe")} Fair Play</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Every spin draws one of 37 numbers (0–36) with an independent, uniformly random
                pick the instant you hit Play. That single-zero pocket is what gives the house its
                2.70% edge — every payout table above already reflects true odds against 37
                outcomes, so nothing further is subtracted at settlement.</p>
                <div class="seed-row">
                  <input type="text" value="${state.clientSeed}" data-client-seed>
                  <button class="seed-randomize" data-randomize-seed>${svg("rotate")} New</button>
                </div>
                <div class="seed-note">This is a demo — nothing here affects real outcomes.</div>
              </div>
            </div>` : ""}
          `;

          // Reinsert the one persistent wheel-stage node into its fresh slot. Because this node
          // is never destroyed, any CSS animation/transition running on it (idle spin, or an
          // in-progress settle) simply keeps running through the DOM move — nothing resets.
          const slot = content.querySelector("[data-wheel-slot]");
          if (slot) slot.replaceWith(wheelStageEl);

          bind();
        }

        function bind() {
          document.querySelectorAll("[data-straight]").forEach((el) => el.addEventListener("click", () => addChipToStraight(parseInt(el.dataset.straight, 10))));
          document.querySelectorAll("[data-outside]").forEach((el) => el.addEventListener("click", () => addChipToOutside(el.dataset.outside)));
          document.querySelector("[data-clear-bets]")?.addEventListener("click", clearBets);
          document.querySelector("[data-undo]")?.addEventListener("click", undoLastBet);
          document.querySelector("[data-half]")?.addEventListener("click", () => scaleAllBets(0.5));
          document.querySelector("[data-double]")?.addEventListener("click", () => scaleAllBets(2));
          document.querySelector("[data-spin]")?.addEventListener("click", doSpin);
          document.querySelector("[data-auto-toggle]")?.addEventListener("click", () => { if (state.auto.running) stopAuto(); else startAuto(); });

          document.querySelectorAll("[data-mode]").forEach((btn) => btn.addEventListener("click", () => {
            if (btn.disabled) return;
            state.mode = btn.dataset.mode;
            render();
          }));

          document.querySelectorAll("[data-chip]").forEach((btn) => btn.addEventListener("click", () => {
            state.selectedChip = parseFloat(btn.dataset.chip);
            Shell.playChipSound("select", state.settings.volume);
            render();
          }));

          document.querySelector("[data-num-spins]")?.addEventListener("input", (e) => { state.auto.numSpins = e.target.value.replace(/[^0-9]/g, ""); });
          document.querySelector("[data-win-pct]")?.addEventListener("input", (e) => { state.auto.onWinPct = e.target.value.replace(/[^0-9.\-]/g, ""); });
          document.querySelector("[data-loss-pct]")?.addEventListener("input", (e) => { state.auto.onLossPct = e.target.value.replace(/[^0-9.\-]/g, ""); });
          document.querySelector("[data-stop-profit]")?.addEventListener("input", (e) => { state.auto.stopOnProfit = e.target.value.replace(/[^0-9.]/g, ""); });
          document.querySelector("[data-stop-loss]")?.addEventListener("input", (e) => { state.auto.stopOnLoss = e.target.value.replace(/[^0-9.]/g, ""); });

          document.querySelector("[data-info]")?.addEventListener("click", () => { state.infoOpen = true; render(); });
          document.querySelector("[data-fair-play]")?.addEventListener("click", () => { state.fairPlayOpen = true; render(); });
          document.querySelectorAll("[data-modal-close]").forEach((btn) => btn.onclick = () => { state.infoOpen = false; state.fairPlayOpen = false; render(); });
          document.querySelector("[data-info-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.infoOpen = false; render(); } });
          document.querySelector("[data-fair-play-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.fairPlayOpen = false; render(); } });
          document.querySelector("[data-client-seed]")?.addEventListener("input", (e) => { state.clientSeed = e.target.value; });
          document.querySelector("[data-randomize-seed]")?.addEventListener("click", () => {
            const chars = "abcdef0123456789";
            const gen = () => Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
            state.clientSeed = `${gen()}-${gen()}-${gen()}-${gen()}`;
            render();
          });

          document.querySelector("[data-settings-toggle]")?.addEventListener("click", (e) => { e.stopPropagation(); state.settingsOpen = !state.settingsOpen; render(); });
          document.querySelectorAll("[data-toggle-setting]").forEach((btn) => btn.onclick = (e) => { e.stopPropagation(); const key = btn.dataset.toggleSetting; state.settings[key] = !state.settings[key]; render(); });
          document.querySelector("[data-volume-slider]")?.addEventListener("input", (e) => { state.settings.volume = parseInt(e.target.value, 10); });

          document.querySelector("[data-fav-toggle]")?.addEventListener("click", () => {
            Shell.toggleFavorite(GAME_ID);
            state.favorite = Shell.getFavorites().includes(GAME_ID);
            render();
          });

          document.querySelector("[data-stats-toggle]")?.addEventListener("click", () => { state.statsOpen = !state.statsOpen; render(); });
          Shell.bindStatsPanel(state, render);

          document.addEventListener("click", (e) => {
            if (state.settingsOpen && !e.target.closest("[data-settings-popover]") && !e.target.closest("[data-settings-toggle]")) {
              state.settingsOpen = false; render();
            }
          }, { once: true });
        }

        Shell.attachStatsPanelDrag(state, render);

        render();
      })();
    </script>
  </body>
</html>
