<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Neon Jackpot fictional arcade demo — Flip" />
    <title>Flip · Neon Jackpot</title>
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./game-frame.css" />
    <style>
      /* ---- stage ---- */
      .game-box.flip-stage {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        padding: 16px;
        background: linear-gradient(160deg, #182d42, #16203d 56%, #321849);
        position: relative;
        perspective: 900px;
      }

      .flip-coin-wrap {
        position: relative;
        width: clamp(160px, 30vw, 240px);
        height: clamp(160px, 30vw, 240px);
      }
      .flip-coin {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transform: rotateY(0deg);
        /* doFlip() sets transition/transform inline for the spin animation itself;
           this base transition only smooths any other incidental transform change. */
        transition: transform .3s ease;
      }
      .no-animations .flip-coin { transition: none !important; }

      .flip-face {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        backface-visibility: hidden;
        display: grid;
        place-items: center;
        box-shadow: 0 10px 40px rgba(0,0,0,.4), inset 0 0 0 6px rgba(255,255,255,.08);
      }
      .flip-face.heads {
        background: radial-gradient(circle at 35% 30%, #ffcf6b, #f5a623 60%, #c9820f);
        transform: rotateY(0deg);
      }
      .flip-face.tails {
        background: radial-gradient(circle at 35% 30%, #7fd9ff, #3aa0ff 60%, #1c6fc9);
        transform: rotateY(180deg);
      }
      .flip-face-ring {
        width: 62%;
        height: 62%;
        border-radius: 50%;
        border: 6px solid rgba(4,20,15,.28);
        display: grid;
        place-items: center;
      }
      .flip-face.heads .flip-face-ring { background: rgba(4,20,15,.12); }
      .flip-face.tails .flip-face-ring { background: rgba(4,20,15,.12); }
      .flip-face-icon { font-size: clamp(28px, 6vw, 44px); font-weight: 900; color: rgba(4,20,15,.55); font-family: var(--mono); }

      /* ---- in-box history strip (mirrors the reference screenshot) ---- */
      .flip-history-wrap {
        position: absolute;
        left: 16px; right: 16px; bottom: 16px;
        background: rgba(8,10,18,.55);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
      }
      .flip-history-label { font-size: 12px; font-weight: 700; color: #8fb8e8; margin-bottom: 8px; }
      .flip-history-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
      .flip-history-row::-webkit-scrollbar { display: none; }
      .flip-history-pip {
        flex: none; width: 30px; height: 30px; border-radius: 8px;
        background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
        display: grid; place-items: center;
      }
      .flip-history-pip .dot { width: 12px; height: 12px; border-radius: 50%; }
      .flip-history-pip.heads .dot { background: linear-gradient(135deg, #ffcf6b, #f5a623); }
      .flip-history-pip.tails .dot { background: linear-gradient(135deg, #7fd9ff, #3aa0ff); }
      .flip-history-empty { font-size: 11px; color: #55617a; padding: 4px 0; }

      .flip-glow {
        position: absolute; inset: -20px; border-radius: 50%;
        pointer-events: none; opacity: 0; transition: opacity .3s ease;
        filter: blur(18px);
      }
      .flip-glow.win { background: radial-gradient(circle, rgba(92,255,231,.55), transparent 70%); opacity: 1; }
      .flip-glow.lose { background: radial-gradient(circle, rgba(255,110,143,.5), transparent 70%); opacity: 1; }

      .flip-result-overlay {
        position: absolute; inset: 0; z-index: 5;
        display: grid; place-items: center;
        background: rgba(8, 9, 16, .62);
        backdrop-filter: blur(1.5px);
        border-radius: inherit;
        animation: flip-overlay-in .18s ease;
        cursor: pointer;
      }
      @keyframes flip-overlay-in { from { opacity: 0; } to { opacity: 1; } }
      .flip-result-card {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        padding: 22px 34px; background: #171c2c; border: 1px solid var(--line); border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0,0,0,.45);
        cursor: default;
      }
      .flip-result-card.win { border-color: rgba(92,255,231,.5); }
      .flip-result-mult { font-family: var(--mono); font-size: 26px; font-weight: 800; color: var(--mint); }
      .flip-result-amt { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--mint); }

      /* ---- sidebar: heads/tails pick row ---- */
      .flip-pick-row { display: flex; gap: 8px; }
      .flip-pick-btn {
        flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
        padding: 12px 0; color: var(--text); background: #0c0e18; border: 1px solid var(--line);
        border-radius: 10px; font-size: 13px; font-weight: 800;
      }
      .flip-pick-btn .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
      .flip-pick-btn.heads .dot { background: linear-gradient(135deg, #ffcf6b, #f5a623); }
      .flip-pick-btn.tails .dot { background: linear-gradient(135deg, #7fd9ff, #3aa0ff); }
      .flip-pick-btn.active { border-color: rgba(58,160,255,.6); background: #151b2c; box-shadow: 0 0 16px rgba(58,160,255,.25); }
      .flip-pick-btn:disabled { opacity: .55; cursor: not-allowed; }
      .flip-spin-hint { margin-top: 8px; text-align: center; font-size: 11px; font-weight: 700; color: #8791a6; }


      /* ---- profit box (matches Mines pattern) ---- */
      .profit-box { margin-top: 14px; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      .profit-box-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
      .profit-box-col { display: flex; flex-direction: column; gap: 3px; }
      .profit-box-col.right { align-items: flex-end; }
      .profit-box-col span { font-size: 10px; color: #69758c; }
      .profit-box-col strong { font-family: var(--mono); font-size: 13px; }
      .profit-box-col.left strong { color: var(--mint); }
      .profit-box-chevron { color: #4c5468; }
      .profit-box-bottom { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 0; background: rgba(0,0,0,.15); font-family: var(--mono); font-size: 11px; font-weight: 700; }
      .profit-box-bottom .cur { color: var(--mint); }
      .profit-box-bottom .divider { color: #3a4256; }
      .profit-box-bottom .nxt { color: #8791a6; }

      .flip-cashout-btn {
        width: 100%; padding: 14px 0; color: #04140f;
        background: linear-gradient(120deg, #38d787, #63f0ab); border: 0; border-radius: 12px;
        font-size: 13px; font-weight: 800;
      }
      .flip-cashout-btn:disabled { color: #6c7488; background: #1b2032; }

      .flip-mult-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-family: var(--mono); font-size: 12px; }
      .flip-mult-table th, .flip-mult-table td { padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--line); }
      .flip-mult-table th { color: #8791a6; font-weight: 700; }
      .flip-mult-table td { color: var(--text); }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <div class="site-grid">
        <div id="site-sidebar"></div>
        <div id="site-topbar"></div>
        <div id="page-content"></div>
      </div>
    </div>
    <script src="./promo-vault.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="./chat.js"></script>
    <script src="./shell.js"></script>
    <script src="./games.js"></script>
    <script>
      (() => {
        const GAME_NAME = "Flip";
        const GAME_ID = "flip";

        Shell.mount({ activeTab: "Games" });
        Chat.mount();
        try { localStorage.removeItem("nj_flip_coin_history"); } catch {} // cleanup from a prior version
        document.addEventListener("nj:animations", (e) => { state.settings.animations = !e.detail; render(); });
        const content = document.getElementById("page-content");
        const svg = Shell.svg;

        const HOUSE_RTP = 0.98;
        const MAX_FLIPS = 10; // beyond this the multiplier keeps compounding but we cap the table/round length

        // ---------------------------------------------------------------
        // MULTIPLIER MATH — true 50/50 coin flip. Fair odds double every
        // flip (2^n), scaled to a 98% RTP target, floor-rounded to 2
        // decimals (never standard rounding) so displayed and paid
        // multipliers always match exactly.
        //   1 flip: 1.96x   2 flips: 3.92x   3 flips: 7.84x ...
        // ---------------------------------------------------------------
        function multiplierFor(flips) {
          if (flips <= 0) return 1;
          const raw = HOUSE_RTP * Math.pow(2, flips);
          let mult = Math.floor(raw * 100) / 100;
          if (mult < 1) mult = 1;
          return mult;
        }

        // ---------------------------------------------------------------
        // sound: win ding (shared Shell.playWinDing) on a correct call,
        // a low thud burst on a loss. Mirrors mines.html's explosion sfx.
        // ---------------------------------------------------------------
        let audioCtx = null;
        const getCtx = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; };
        function playThud(volumePct) {
          const v = volumePct / 100;
          if (v <= 0) return;
          try {
            const ctx = getCtx();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.35);
            g.gain.setValueAtTime(0.5 * v, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
            osc.connect(g).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
          } catch {}
        }

        const state = {
          betAmount: "",
          busy: false,
          infoOpen: false,
          fairPlayOpen: false,
          settingsOpen: false,
          statsOpen: false,
          statsGame: "all",
          statsGameDropdownOpen: false,
          statsDrag: null,
          statsPos: null,
          favorite: Shell.getFavorites().includes(GAME_ID),
          settings: { animations: !Shell.isAnimationsDisabled(), volume: 100 },

          active: false,
          betAmt: 0,
          pick: null,            // player's current call for the NEXT flip — chosen after betting, per round
          streak: [],            // array of "heads" | "tails" — this round's flips so far. Resets on every new bet, drives both bet-log detail and the on-screen History strip.
          flips: 0,             // successful correct calls so far
          coinFace: "heads",    // which face is currently showing on the coin element
          spinning: false,
          pendingOutcome: null, // outcome computed for the in-flight spin, resolved after animation
          lastResult: null,
          showResultOverlay: false,
        };

        function recordBet(betAmount, result) {
          Shell.addBetEntry({ game: GAME_ID, bet: betAmount, won: result.won, profit: result.profit, detail: { type: "flip", streak: state.streak.slice(), pick: result.finalPick } });
          // Stake was already deducted up front in startRound(). On a win, credit the FULL
          // payout (stake + profit); on a loss, nothing further is credited.
          if (result.won) Shell.addBalance(betAmount + result.profit);
        }

        function persistRound() {
          if (!state.active) { Shell.clearActiveRound(GAME_ID); return; }
          Shell.saveActiveRound(GAME_ID, {
            betAmt: state.betAmt, streak: state.streak, flips: state.flips,
            pick: state.pick, coinFace: state.coinFace,
          });
        }

        function startRound() {
          if (state.busy || state.active) return;
          const raw = parseFloat(state.betAmount);
          let amt = state.betAmount !== "" && !isNaN(raw) && raw > 0 ? Math.round(raw * 100) / 100 : 0;
          const balance = Shell.getBalance();
          if (amt > 0 && Shell.isBelowMinBet(amt)) { Shell.notify(`Minimum bet is ${Shell.fmtMoney(Shell.MIN_BET)}.`); return; }
          if (amt > 0 && (balance <= 0 || amt > balance)) { Shell.notify("Insufficient balance."); return; }
          amt = Math.min(amt, balance);

          if (amt > 0) Shell.addBalance(-amt);
          state.active = true;
          state.betAmt = amt;
          state.pick = null;
          state.streak = [];
          state.flips = 0;
          state.lastResult = null;
          state.showResultOverlay = false;
          persistRound();
          render();
        }

        function doFlip() {
          if (state.busy || !state.active || state.spinning || !state.pick) return;
          state.spinning = true;
          state.busy = true;
          const outcome = Math.random() < 0.5 ? "heads" : "tails";
          state.pendingOutcome = outcome;
          render();

          // Two-phase animation applied directly to the coin element (not re-rendered
          // mid-spin, so the linear phase stays perfectly constant-speed instead of being
          // interrupted by innerHTML rebuilds): a fast constant-velocity spin, then a
          // short eased deceleration onto the landing face. Splitting it into two separate
          // transitions is what avoids the "starts fast, immediately decelerates the whole
          // way" look a single eased transition over the full rotation gives.
          if (!state.settings.animations) {
            resolveFlip(outcome);
            return;
          }

          const startDeg = state.coinFace === "tails" ? 180 : 0;
          const spinRotations = 5;
          // The spin animation always ends at startDeg + spinRotations*360 — i.e. back on
          // whatever face it started on, since spinRotations is a whole number of full turns.
          // To land on `outcome` we add 180 on top ONLY if that starting face differs from the
          // target face; adding a flat 180-for-tails on top of startDeg (the old, buggy
          // formula) double-counted the offset whenever the coin was already resting on tails,
          // silently landing it back on the wrong face — exactly the mismatch reported.
          const spinEndDeg = startDeg + spinRotations * 360;   // where the spin phase parks (same face as start)
          const spinEndFace = spinEndDeg % 360 === 180 ? "tails" : "heads";
          const landDeg = spinEndDeg + (spinEndFace === outcome ? 0 : 180);

          const spinCoinEl = document.querySelector("[data-flip-coin]");
          if (spinCoinEl) {
            // Explicitly pin the starting transform with no transition, force a synchronous
            // reflow (reading offsetHeight flushes layout), THEN apply the transitioned
            // transform. Without the forced reflow, the browser can coalesce "set transform A"
            // immediately followed by "set transform B" into a single style recalculation and
            // just jump straight to B with no visible animation at all — which is exactly the
            // "animation doesn't play" symptom.
            spinCoinEl.style.transition = "none";
            spinCoinEl.style.transform = `rotateY(${startDeg}deg)`;
            void spinCoinEl.offsetHeight; // force reflow
            spinCoinEl.style.transition = "transform 900ms linear";
            spinCoinEl.style.transform = `rotateY(${spinEndDeg}deg)`;
          }

          setTimeout(() => {
            // Re-query fresh rather than closing over the node above — defensive against any
            // future re-render mid-spin swapping the DOM node out from under this callback.
            const landCoinEl = document.querySelector("[data-flip-coin]");
            if (landCoinEl) {
              landCoinEl.style.transition = "transform 500ms cubic-bezier(.22,.7,.32,1)";
              landCoinEl.style.transform = `rotateY(${landDeg}deg)`;
            }
          }, 900);

          // Resolve once both animation phases have finished (900ms spin + 500ms land).
          // outcome was decided once, up front, and is threaded through unchanged to both
          // the visual landing transform above and the win/loss check in resolveFlip below —
          // there is no second source of truth that could disagree with what the coin shows.
          setTimeout(() => resolveFlip(outcome), 1450);
        }

        function resolveFlip(outcome) {
          const correct = outcome === state.pick;
          state.streak.push(outcome);
          state.coinFace = outcome;
          state.spinning = false;

          if (!correct) {
            playThud(state.settings.volume);
            const result = { won: false, profit: -state.betAmt, payout: 0, payoutLabel: "0.00x", finalPick: state.pick };
            recordBet(state.betAmt, result);
            state.lastResult = result;
            state.active = false;
            state.busy = false;
            state.showResultOverlay = true;
            Shell.clearActiveRound(GAME_ID);
            render();
            return;
          }

          Shell.playWinDing(state.settings.volume);
          state.flips += 1;
          state.busy = false;
          state.pick = null; // require an explicit call for the next flip too
          persistRound();
          render();
        }

        function cashOut() {
          if (!state.active || state.flips < 1) return;
          const mult = multiplierFor(state.flips);
          const payout = state.betAmt * mult;
          const result = { won: true, profit: payout - state.betAmt, payout, payoutLabel: `${mult.toFixed(2)}x`, finalPick: state.pick };
          recordBet(state.betAmt, result);
          state.lastResult = result;
          state.active = false;
          state.busy = false;
          state.showResultOverlay = true;
          Shell.clearActiveRound(GAME_ID);
          render();
        }

        function dismissResultOverlay(e) {
          if (e && e.target.closest(".flip-result-card")) return;
          if (!state.showResultOverlay) return;
          state.showResultOverlay = false;
          render();
        }

        function resultOverlayHTML(r) {
          return `<div class="flip-result-overlay" data-result-overlay>
            <div class="flip-result-card win">
              <div class="flip-result-mult">${r.payoutLabel}</div>
              <div class="flip-result-amt">+${Shell.fmtMoney(r.payout)}</div>
            </div>
          </div>`;
        }

        function coinHTML() {
          // CRITICAL: while a spin is in flight, doFlip() owns the coin's transform/transition
          // via direct DOM manipulation (see doFlip) so the animation plays smoothly across
          // its full 1.4s duration. If render() ran here and stamped a fresh inline
          // transform/style string onto a fresh <div data-flip-coin> every time — which is
          // exactly what happens if anything triggers a re-render mid-spin (opening the stats
          // panel, a settings toggle, the volume slider, etc.) — the browser replaces the
          // element outright and the in-progress animation is destroyed and restarted from
          // scratch, so the coin can visually settle on the wrong face relative to the
          // already-decided `outcome`. Suppressing the transform here while state.spinning is
          // true (and only ever setting state.coinFace once resolveFlip() has the final,
          // authoritative outcome) keeps what the coin lands on and what the game decided
          // permanently in sync — a fresh render always reflects the last SETTLED face, never
          // a stale mid-spin snapshot.
          const rotateY = state.coinFace === "tails" ? 180 : 0;
          const glowClass = state.lastResult && state.showResultOverlay ? (state.lastResult.won ? "win" : "lose") : "";
          return `<div class="flip-coin-wrap">
            <div class="flip-glow ${glowClass}"></div>
            <div class="flip-coin" data-flip-coin ${state.spinning ? "data-spin-locked" : ""} style="transform:rotateY(${rotateY}deg);">
              <div class="flip-face heads"><div class="flip-face-ring"><div class="flip-face-icon">H</div></div></div>
              <div class="flip-face tails"><div class="flip-face-ring"><div class="flip-face-icon">T</div></div></div>
            </div>
          </div>`;
        }

        function historyHTML() {
          const pips = state.streak.length
            ? state.streak.slice().reverse().map((f) => `<div class="flip-history-pip ${f}"><div class="dot"></div></div>`).join("")
            : `<div class="flip-history-empty">No flips yet</div>`;
          return `<div class="flip-history-wrap">
            <div class="flip-history-label">History</div>
            <div class="flip-history-row">${pips}</div>
          </div>`;
        }

        function multTableRows() {
          const rows = [];
          for (let i = 1; i <= MAX_FLIPS; i++) rows.push(`<tr><td>${i}</td><td>${multiplierFor(i).toFixed(2)}x</td></tr>`);
          return rows.join("");
        }

        function render() {
          const balance = Shell.getBalance();
          const betRaw = parseFloat(state.betAmount);
          const hasBet = state.betAmount !== "" && !isNaN(betRaw) && betRaw > 0;
          const demoMode = !state.active && !hasBet;
          const insufficientBalance = !state.active && hasBet && betRaw > balance;
          const belowMinBet = !state.active && hasBet && Shell.isBelowMinBet(betRaw);
          const canCashOut = state.active && state.flips >= 1 && !state.busy && !state.spinning;
          const canFlip = state.active && !state.busy && !state.spinning;
          const currentMult = state.active && state.flips >= 1 ? multiplierFor(state.flips) : 1;
          const currentProfit = state.active && state.flips >= 1 ? state.betAmt * currentMult - state.betAmt : 0;
          const nextMult = multiplierFor((state.active ? state.flips : 0) + 1);
          const previewBet = state.active ? state.betAmt : (parseFloat(state.betAmount) || 0);
          const nextProfit = previewBet > 0 ? previewBet * nextMult - previewBet : 0;
          const r = state.lastResult;
          const won = r ? r.won : null;

          content.innerHTML = `
            <div class="game-page">
              <div class="game-shell ${state.settings.animations ? "" : "no-animations"}">
                <div class="shell-grid">

                  <header class="title-bar">
                    <button class="game-icon-btn hover-tip" data-hover-tip="Game info" data-info>${svg("safe")}</button>
                    <div class="title-name">${GAME_NAME}</div>
                    <button class="fair-play-btn" data-fair-play>${svg("safe")} Fair Play</button>
                  </header>

                  <aside class="sidebar">
                    <div class="field-label">Bet Amount</div>
                    <div class="bet-input-row">
                      <span class="prefix">$</span>
                      <input type="text" inputmode="decimal" placeholder="0.00" value="${state.betAmount}" data-bet-input class="${insufficientBalance || belowMinBet ? "error" : ""}" ${state.active ? "disabled" : ""}>
                      <div class="bet-quick">
                        <button data-half ${state.active ? "disabled" : ""}>½</button>
                        <button data-double-bet ${state.active ? "disabled" : ""}>2×</button>
                      </div>
                    </div>
                    ${insufficientBalance ? `<div class="balance-error">Insufficient balance</div>` : ""}
                    ${!insufficientBalance && belowMinBet ? `<div class="balance-error">Minimum bet is ${Shell.fmtMoney(Shell.MIN_BET)}</div>` : ""}

                    <div class="field-label" style="margin-top:16px;">Pick a Side</div>
                    <div class="flip-pick-row">
                      <button class="flip-pick-btn heads ${state.pick === "heads" ? "active" : ""}" data-pick="heads" ${canFlip ? "" : "disabled"}>
                        <span class="dot"></span> Heads
                      </button>
                      <button class="flip-pick-btn tails ${state.pick === "tails" ? "active" : ""}" data-pick="tails" ${canFlip ? "" : "disabled"}>
                        <span class="dot"></span> Tails
                      </button>
                    </div>
                    ${state.spinning ? `<div class="flip-spin-hint">Flipping…</div>` : ""}

                    ${!state.active ? `
                    <button class="place-bet-btn ${hasBet ? "" : "demo"}" data-place ${insufficientBalance || belowMinBet ? "disabled" : ""} style="margin-top:16px;">
                      ${hasBet ? "Place Bet" : "Place Demo Bet"}
                    </button>
                    ${demoMode ? `<div class="demo-hint-wrap"><div class="demo-hint">Enter Bet Amount For Real Play</div></div>` : ""}` : `
                    <div class="profit-box">
                      <div class="profit-box-top">
                        <div class="profit-box-col left"><span>Current Profit</span><strong>${Shell.fmtMoney(currentProfit)}</strong></div>
                        <div class="profit-box-chevron">›</div>
                        <div class="profit-box-col right"><span>Next</span><strong>${Shell.fmtMoney(Math.max(0, nextProfit))}</strong></div>
                      </div>
                      <div class="profit-box-bottom"><span class="cur">${state.flips >= 1 ? currentMult.toFixed(2) : "0"}x</span><span class="divider">|</span><span class="nxt">${nextMult.toFixed(2)}x</span></div>
                    </div>
                    <button class="flip-cashout-btn" data-cashout ${canCashOut ? "" : "disabled"} style="margin-top:12px;">
                      Cash Out ${state.flips >= 1 ? `— ${Shell.fmtMoney(state.betAmt * currentMult)}` : ""}
                    </button>`}

                    <div class="sidebar-meta">
                      <div class="sidebar-meta-row"><span>Balance</span><strong>${Shell.fmtMoney(balance)}</strong></div>
                      ${state.active ? `<div class="sidebar-meta-row"><span>Correct calls</span><strong>${state.flips}</strong></div>` : ""}
                    </div>
                  </aside>

                  <section class="game-box flip-stage">
                    ${coinHTML()}
                    ${historyHTML()}
                    ${r && state.showResultOverlay && won ? resultOverlayHTML(r) : ""}
                  </section>

                  <footer class="bottom-bar">
                    <div class="bottom-icons">
                      <div style="position:relative;">
                        <button class="bottom-icon-btn ${state.settingsOpen ? "active" : ""}" data-settings-toggle title="Settings">${svg("settings")}</button>
                        ${state.settingsOpen ? `
                        <div class="popover" data-settings-popover>
                          <div class="popover-title">Game Settings</div>
                          <div class="popover-row"><span>Animations</span><button class="switch ${state.settings.animations ? "on" : ""}" data-toggle-setting="animations" ${Shell.isAnimationsDisabled() ? "disabled" : ""}></button></div>
                          <div class="volume-row"><span>Volume — ${state.settings.volume}%</span><input type="range" min="0" max="100" value="${state.settings.volume}" data-volume-slider></div>
                        </div>` : ""}
                      </div>
                      <button class="bottom-icon-btn ${state.favorite ? "fav-on" : ""}" data-fav-toggle title="Favorite">${svg("heart")}</button>
                      <button class="bottom-icon-btn ${state.statsOpen ? "active" : ""}" data-stats-toggle title="Live stats">${svg("activity")}</button>
                    </div>
                    <div class="bottom-logo">Neon Jackpot</div>
                  </footer>
                </div>

                ${Shell.statsPanelHTML(state, GAME_ID, GAME_NAME)}
              </div>
            </div>

            ${state.infoOpen ? `
            <div class="modal-overlay" data-info-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${GAME_NAME}</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Place your bet, then tap Heads or Tails to flip — that tap starts the round.
                Guess right and your
                multiplier compounds — guess wrong and the round ends with nothing. Cash out any
                time after your first correct call to lock in the current payout.</p>
                <table class="flip-mult-table">
                  <thead><tr><th>Flips</th><th>Multiplier</th></tr></thead>
                  <tbody>${multTableRows()}</tbody>
                </table>
              </div>
            </div>` : ""}

            ${state.fairPlayOpen ? `
            <div class="modal-overlay" data-fair-play-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${svg("safe")} Fair Play</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Each flip is an independent, uniformly random 50/50 outcome generated the
                moment you tap Heads or Tails. Multipliers double every consecutive correct call —
                true even odds — divided into a 98% return-to-player target, then floored to 2
                decimals so displayed and paid multipliers always match exactly.</p>
              </div>
            </div>` : ""}
          `;

          bind();
        }

        function refocus(sel) {
          const el = document.querySelector(sel);
          if (el) { el.focus(); const v = el.value; el.value = ""; el.value = v; }
        }

        function bind() {
          if (state.showResultOverlay) {
            document.querySelector(".sidebar")?.addEventListener("click", dismissResultOverlay);
            document.querySelector("[data-result-overlay]")?.addEventListener("click", dismissResultOverlay);
          }

          document.querySelector("[data-place]")?.addEventListener("click", startRound);
          document.querySelector("[data-cashout]")?.addEventListener("click", cashOut);

          document.querySelectorAll("[data-pick]").forEach((btn) => btn.addEventListener("click", () => {
            if (state.busy || state.spinning || !state.active) return;
            state.pick = btn.dataset.pick;
            doFlip();
          }));

          const betInput = document.querySelector("[data-bet-input]");
          betInput?.addEventListener("input", (e) => {
            state.betAmount = e.target.value.replace(/[^0-9.]/g, "");
            render();
            refocus("[data-bet-input]");
          });
          document.querySelector("[data-half]")?.addEventListener("click", () => {
            const b = parseFloat(state.betAmount) || 0;
            state.betAmount = (b / 2).toFixed(2);
            render();
          });
          document.querySelector("[data-double-bet]")?.addEventListener("click", () => {
            const b = parseFloat(state.betAmount) || 0;
            state.betAmount = Math.min(b * 2 || 0, Shell.getBalance()).toFixed(2);
            render();
          });

          document.querySelector("[data-info]")?.addEventListener("click", () => { state.infoOpen = true; render(); });
          document.querySelector("[data-fair-play]")?.addEventListener("click", () => { state.fairPlayOpen = true; render(); });
          document.querySelectorAll("[data-modal-close]").forEach((btn) => btn.onclick = () => { state.infoOpen = false; state.fairPlayOpen = false; render(); });
          document.querySelector("[data-info-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.infoOpen = false; render(); } });
          document.querySelector("[data-fair-play-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.fairPlayOpen = false; render(); } });

          document.querySelector("[data-settings-toggle]")?.addEventListener("click", () => { state.settingsOpen = !state.settingsOpen; render(); });
          document.querySelector("[data-toggle-setting]")?.addEventListener("click", (e) => {
            const key = e.currentTarget.dataset.toggleSetting;
            state.settings[key] = !state.settings[key];
            render();
          });
          document.querySelector("[data-volume-slider]")?.addEventListener("input", (e) => { state.settings.volume = parseInt(e.target.value, 10); });

          document.querySelector("[data-fav-toggle]")?.addEventListener("click", () => {
            Shell.toggleFavorite(GAME_ID);
            state.favorite = Shell.getFavorites().includes(GAME_ID);
            render();
          });

          document.querySelector("[data-stats-toggle]")?.addEventListener("click", () => { state.statsOpen = !state.statsOpen; render(); });
          Shell.bindStatsPanel(state, render);

          document.addEventListener("click", (e) => {
            if (state.settingsOpen && !e.target.closest("[data-settings-popover]") && !e.target.closest("[data-settings-toggle]")) {
              state.settingsOpen = false; render();
            }
          }, { once: true });
        }

        Shell.attachStatsPanelDrag(state, render);

        (function restoreRound() {
          const saved = Shell.loadActiveRound(GAME_ID);
          if (!saved) return;
          state.betAmt = saved.betAmt;
          state.streak = saved.streak || [];
          state.flips = saved.flips || 0;
          state.pick = saved.pick || null;
          state.coinFace = saved.coinFace || "heads";
          state.active = true;
          state.lastResult = null;
          state.showResultOverlay = false;
        })();

        render();
      })();
    </script>
  </body>
</html>
