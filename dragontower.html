<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Neon Jackpot fictional arcade demo — Dragon Tower" />
    <title>Dragon Tower · Neon Jackpot</title>
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./game-frame.css" />
    <style>
      /* ---- stage: fills the full game-box top-to-bottom, tiles sized to match ---- */
      .game-box.tower-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        padding: 16px 14px;
        background: linear-gradient(160deg, #182d42, #16203d 56%, #321849);
        position: relative;
      }
      .tower-grid {
        display: flex;
        flex-direction: column-reverse;
        flex: 1;
        gap: 6px;
        width: 100%;
        max-width: 460px;
      }
      .tower-row { flex: 1; display: grid; gap: 6px; opacity: .62; filter: saturate(.7); min-height: 0; }
      .tower-row.is-active { opacity: 1; filter: none; }
      .tower-row.is-cleared { opacity: .92; filter: none; }
      .tower-tile {
        position: relative;
        height: 100%;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,.16);
        background: linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1;
        gap: 3px;
      }
      /* transform transition scoped to real user hover only — applying it to every tile means
         any full re-render (e.g. opening the risk dropdown, which rebuilds the whole grid as
         fresh DOM nodes) makes freshly-mounted tiles animate in from their implicit start state,
         which looked like the whole board "bouncing" for no reason. */
      .tower-row.is-active .tower-tile:not(.revealed) {
        border-color: rgba(255,255,255,.28);
        background: linear-gradient(160deg, rgba(255,255,255,.2), rgba(255,255,255,.07));
        transition: transform .12s ease, background .2s ease, border-color .2s ease;
      }
      .tower-tile.revealed { transition: background .2s ease, border-color .2s ease; }
      .tower-tile .egg { font-size: 26px; }
      .tower-tile .tmult { font-size: 11px; font-weight: 700; color: #69758c; font-family: var(--mono); background: rgba(0,0,0,.35); padding: 2px 7px; border-radius: 999px; }
      .tower-row.is-active .tower-tile .tmult { color: var(--mint); }
      .tower-row.is-active .tower-tile:not(.revealed) { cursor: pointer; }
      .tower-row.is-active .tower-tile:not(.revealed):hover { transform: translateY(-2px); border-color: rgba(92,255,231,.5); }
      .tower-tile.revealed.safe { background: radial-gradient(circle at 35% 30%, #ffe9a8, #ffcf7d 70%); border-color: #ffcf7d; box-shadow: 0 0 14px rgba(255,207,125,.4); opacity: 1 !important; }
      .tower-tile.revealed.lava { background: radial-gradient(circle at 35% 30%, #ff9a7d, var(--red) 70%); border-color: var(--red); box-shadow: 0 0 14px rgba(255,92,92,.5); }
.tower-tile.revealed.dim-reveal { opacity: .4 !important; box-shadow: none; }
      /* the pop/erupt animation only plays on a tile's first-ever reveal render (see
         gridHTML's animatedTiles tracking) — never on tiles that were already revealed
         before this render, so opening the risk dropdown etc. can't replay it. */
      .tower-tile.revealed.safe.just-revealed { animation: tower-crack .3s ease; }
      .tower-tile.revealed.lava.just-revealed { animation: tower-erupt .35s ease; }
      @keyframes tower-crack { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
      @keyframes tower-erupt { 0% { transform: scale(.7) rotate(0deg); } 50% { transform: scale(1.2) rotate(-6deg); } 100% { transform: scale(1) rotate(0deg); } }

      /* ---- animations off: strip every transition/keyframe so reveals are instant ---- */
      .no-animations .tower-tile,
      .no-animations .tower-tile.revealed.safe,
      .no-animations .tower-tile.revealed.lava,
      .no-animations .tower-result-overlay {
        transition: none !important;
        animation: none !important;
      }
      .no-animations .tower-row.is-active .tower-tile:not(.revealed):hover { transform: none; }

      /* ---- result overlay: dims the board and shows the outcome (matches keno) ---- */
      .tower-result-overlay {
        position: absolute; inset: 0; z-index: 5;
        display: grid; place-items: center;
        background: rgba(8, 9, 16, .62);
        backdrop-filter: blur(1.5px);
        border-radius: inherit;
        animation: tower-overlay-in .18s ease;
        cursor: pointer;
      }
      @keyframes tower-overlay-in { from { opacity: 0; } to { opacity: 1; } }
      .tower-result-card {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        padding: 22px 34px; background: #171c2c; border: 1px solid var(--line); border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0,0,0,.45);
        cursor: default;
      }
      .tower-result-card.win { border-color: rgba(92,255,231,.5); }
      .tower-result-card.lose { border-color: rgba(255,110,143,.35); }
      .tower-result-mult { font-family: var(--mono); font-size: 26px; font-weight: 800; color: var(--mint); }
      .tower-result-card.lose .tower-result-mult { color: #ff9fae; }
      .tower-result-amt { font-family: var(--mono); font-size: 13px; font-weight: 700; }
      .tower-result-amt.win { color: var(--mint); }
      .tower-result-amt.lose { color: #ff9fae; }

      /* ---- custom risk dropdown with diamonds ---- */
      .risk-row { position: relative; }
      .risk-toggle {
        width: 100%; display: flex; align-items: center; justify-content: space-between;
        padding: 11px 12px; color: var(--text); background: #121522; border: 1px solid var(--line);
        border-radius: 10px; font-size: 12.5px; font-weight: 700;
      }
      .risk-toggle svg { width: 13px; height: 13px; color: #7c88a0; transition: transform .15s ease; }
      .risk-toggle.open svg { transform: rotate(180deg); }
      .risk-menu {
        position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20;
        padding: 6px; background: #171c2c; border: 1px solid var(--line); border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0,0,0,.4);
      }
      .risk-menu button {
        width: 100%; display: flex; align-items: center; justify-content: space-between;
        padding: 9px 10px; color: #cdd4e2; background: transparent; border: 0; border-radius: 8px;
        font-size: 12px; font-weight: 700;
      }
      .risk-menu button:hover { background: rgba(255,255,255,.06); }
      .risk-menu button.active { background: rgba(92,255,231,.08); }
      .risk-diamonds { display: flex; gap: 3px; }
      .risk-diamonds svg { width: 10px; height: 10px; }

      /* ---- current profit / next box ---- */
      .profit-box { margin-top: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      .profit-box-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
      .profit-box-col { display: flex; flex-direction: column; gap: 3px; }
      .profit-box-col.right { align-items: flex-end; }
      .profit-box-col span { font-size: 10px; color: #69758c; }
      .profit-box-col strong { font-family: var(--mono); font-size: 13px; }
      .profit-box-col.left strong { color: var(--mint); }
      .profit-box-chevron { color: #4c5468; }
      .profit-box-bottom { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 0; background: rgba(0,0,0,.15); font-family: var(--mono); font-size: 11px; font-weight: 700; }
      .profit-box-bottom .cur { color: var(--mint); }
      .profit-box-bottom .divider { color: #3a4256; }
      .profit-box-bottom .nxt { color: #8791a6; }

      .tower-cashout-btn {
        width: 100%; padding: 14px 0; color: #04140f;
        background: linear-gradient(120deg, #38d787, #63f0ab); border: 0; border-radius: 12px;
        font-size: 13px; font-weight: 800;
      }
      .tower-cashout-btn:disabled { color: #6c7488; background: #1b2032; }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <div class="site-grid">
        <div id="site-sidebar"></div>
        <div id="site-topbar"></div>
        <div id="page-content"></div>
      </div>
    </div>
    <script src="./promo-vault.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="./chat.js"></script>
    <script src="./shell.js"></script>
    <script src="./games.js"></script>
    <script>
      (() => {
        const GAME_NAME = "Dragon Tower";
        const GAME_ID = "dragontower";

        Shell.mount({ activeTab: "Games" });
        Chat.mount();
        document.addEventListener("nj:animations", (e) => { state.settings.animations = !e.detail; render(); });
        const content = document.getElementById("page-content");
        const svg = Shell.svg;

        const ROWS = 8;
        const RISK_MODES = {
          easy:   { label: "Easy",   cols: 4, lava: 1 },
          medium: { label: "Medium", cols: 3, lava: 1 },
          hard:   { label: "Hard",   cols: 2, lava: 1 },
          expert: { label: "Expert", cols: 5, lava: 4 },
        };
        const HOUSE_RTP = 0.96;

        function safeProb(mode) { const m = RISK_MODES[mode]; return (m.cols - m.lava) / m.cols; }
        function multiplierAt(mode, level) {
          if (level <= 0) return 1;
          const raw = (1 / Math.pow(safeProb(mode), level)) * HOUSE_RTP;
          // Round to the same 2 decimal places shown in the UI (e.g. "2.28x") so the multiplier
          // used to compute the actual payout always matches what the player sees on screen —
          // otherwise a displayed "2.28x" could quietly pay out on an unrounded 2.2756x instead.
          return Math.round(raw * 100) / 100;
        }
        function diamondSVG(color) {
          return `<svg viewBox="0 0 24 24"><path d="M12 2 L22 12 L12 22 L2 12 Z" fill="${color}"/></svg>`;
        }
        function riskDiamondsHTML(mode) {
          const m = RISK_MODES[mode];
          const safe = m.cols - m.lava;
          let out = "";
          for (let i = 0; i < safe; i++) out += diamondSVG("var(--mint)");
          for (let i = 0; i < m.lava; i++) out += diamondSVG("var(--red)");
          return `<span class="risk-diamonds">${out}</span>`;
        }

        // ---------------------------------------------------------------
        // sound: only two effects — a win ding on a safe pick, and a glass-
        // shatter burst on a losing pick. No chip/place/click sounds.
        // ---------------------------------------------------------------
        let audioCtx = null;
        const getCtx = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; };
        function playShatter(volumePct) {
          const v = volumePct / 100;
          if (v <= 0) return;
          try {
            const ctx = getCtx();
            const now = ctx.currentTime;
            const dur = 0.35;
            const bufferSize = Math.floor(ctx.sampleRate * dur);
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const bandpass = ctx.createBiquadFilter();
            bandpass.type = "highpass";
            bandpass.frequency.setValueAtTime(1800, now);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.5 * v, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + dur);
            noise.connect(bandpass).connect(g).connect(ctx.destination);
            noise.start(now);
            noise.stop(now + dur);
          } catch {}
        }

        const state = {
          betAmount: "",
          busy: false,
          infoOpen: false,
          fairPlayOpen: false,
          settingsOpen: false,
          statsOpen: false,
          statsGame: "all",
          statsGameDropdownOpen: false,
          statsDrag: null,
          statsPos: null,
          favorite: Shell.getFavorites().includes(GAME_ID),
          settings: { animations: !Shell.isAnimationsDisabled(), volume: 100 },

          risk: "easy",
          riskOpen: false,
          active: false,
          betAmt: 0,
          rows: null,
          revealed: null,
          revealedDim: null, // parallel to revealed — true for tiles swept in by cash-out/bust reveal that the player never actually clicked
          level: 0,
          showResultOverlay: false,
          lastResult: null,
          // tiles ("r:c") whose reveal pop/erupt animation has already played once —
          // re-renders (e.g. opening the risk dropdown) must NOT replay it, since a
          // full innerHTML rebuild recreates the DOM node and would otherwise
          // re-trigger the CSS animation on every already-revealed tile.
          animatedTiles: new Set(),
          lastPickedRow: null,
          lastPickedCol: null,
          clickedCells: new Set(), // "r:c" of tiles actually clicked (not the whole bust row) — used for the bet detail snapshot
        };

        function buildRows(mode) {
          const m = RISK_MODES[mode];
          const rows = [];
          for (let r = 0; r < ROWS; r++) {
            const row = new Array(m.cols).fill("safe");
            const lavaSpots = new Set();
            while (lavaSpots.size < m.lava) lavaSpots.add(Math.floor(Math.random() * m.cols));
            lavaSpots.forEach((i) => (row[i] = "lava"));
            rows.push(row);
          }
          return rows;
        }

        function buildBetDetail() {
          // Three tiers, matching Rainbet: (1) the tile(s) the player actually clicked — shown
          // full-bright, last one highlighted; (2) rows ABOVE the highest row they reached —
          // never played, so shown revealed but dimmed, letting them see what would've come
          // next; (3) everything else (unclicked tiles in rows at/below where they stopped) —
          // fully hidden, since those were never in play once the round ended there.
          const rows = state.rows.map((row, r) =>
            row.map((outcome, c) => {
              const wasClicked = state.clickedCells.has(`${r}:${c}`);
              const aboveReached = r >= state.level;
              return {
                state: outcome === "lava" ? "hit" : "safe",
                picked: r === state.lastPickedRow && c === state.lastPickedCol,
                wasRevealed: wasClicked || aboveReached,
                dim: !wasClicked && aboveReached,
              };
            })
          );
          return { type: "rows", rows };
        }

        function recordBet(betAmount, result) {
          Shell.addBetEntry({ game: GAME_ID, bet: betAmount, won: result.won, profit: result.profit, detail: buildBetDetail() });
          // The bet amount was already deducted up front in startRound() (Shell.addBalance(-amt)).
          // On a loss, result.profit is -betAmt for bookkeeping/display purposes (bets.html, the
          // stats graph, etc. all expect a negative profit to represent the loss) — but the
          // balance itself must NOT be debited a second time here, or a $100 loss removes $200.
          // On a win, result.profit is (payout - betAmt) — that's the NET gain, used for the bet
          // log/stats. But crediting only the net gain here is wrong, because the stake is still
          // sitting deducted from startRound()'s addBalance(-amt): adding just the profit leaves
          // the player short by the exact bet amount (e.g. a $100 bet cashed out at 2.28x should
          // net +$128, but only adding the $128 "profit" on top of the already-deducted $100
          // nets just +$28). The fix is to credit the FULL payout (stake + profit) on a win, same
          // as the pattern blackjack.html and plinko.html already use correctly.
          if (result.won) Shell.addBalance(betAmount + result.profit);
        }

        // Persist the in-progress round so navigating away by accident (clicking the lobby
        // link, a sidebar item, etc.) doesn't forfeit the bet — only called while a real round
        // is active (a bet has been placed), never for the idle/pre-bet screen.
        function persistRound() {
          if (!state.active) { Shell.clearActiveRound(GAME_ID); return; }
          Shell.saveActiveRound(GAME_ID, {
            risk: state.risk, betAmt: state.betAmt, rows: state.rows,
            revealed: state.revealed, level: state.level,
          });
        }

        function startRound() {
          if (state.busy || state.active) return;
          const raw = parseFloat(state.betAmount);
          let amt = state.betAmount !== "" && !isNaN(raw) && raw > 0 ? Math.round(raw * 100) / 100 : 0;
          const balance = Shell.getBalance();
          if (amt > 0 && (balance <= 0 || amt > balance)) { Shell.notify("Insufficient balance."); return; }
          if (amt > 0 && Shell.isBelowMinBet(amt)) { Shell.notify("Minimum bet is $0.10."); return; }
          amt = Math.min(amt, balance);

          if (amt > 0) Shell.addBalance(-amt);
          state.active = true;
          state.betAmt = amt;
          state.rows = buildRows(state.risk);
          state.revealed = state.rows.map((row) => new Array(row.length).fill(false));
          state.revealedDim = state.rows.map((row) => new Array(row.length).fill(false));
          state.level = 0;
          state.lastResult = null;
          state.showResultOverlay = false;
          state.animatedTiles.clear();
          state.lastPickedRow = null;
          state.lastPickedCol = null;
          state.clickedCells.clear();
          persistRound();
          render();
        }

        function pickTile(rowIdx, colIdx) {
          if (state.busy || !state.active) return;
          if (rowIdx !== state.level) return;
          if (state.revealed[rowIdx][colIdx]) return;

          state.busy = true;
          const outcome = state.rows[rowIdx][colIdx];
          state.revealed[rowIdx][colIdx] = true;
          state.lastPickedRow = rowIdx;
          state.lastPickedCol = colIdx;
          state.clickedCells.add(`${rowIdx}:${colIdx}`);
          render();

          const delay = state.settings.animations ? 380 : 0;
          setTimeout(() => {
            if (outcome === "lava") {
              state.revealedDim = state.revealedDim || state.rows.map((row) => new Array(row.length).fill(false));
              state.rows[rowIdx].forEach((_, i) => {
                state.revealed[rowIdx][i] = true;
                if (!state.clickedCells.has(`${rowIdx}:${i}`)) state.revealedDim[rowIdx][i] = true;
              });
              playShatter(state.settings.volume);
              const result = { won: false, profit: -state.betAmt, payout: 0, payoutLabel: "0.00x" };
              recordBet(state.betAmt, result);
              state.lastResult = result;
              state.active = false;
              state.busy = false;
              state.showResultOverlay = true;
              Shell.clearActiveRound(GAME_ID);
              render();
              return;
            }

            Shell.playWinDing(state.settings.volume);
            state.level += 1;
            if (state.level >= ROWS) { cashOut(true); return; }
            state.busy = false;
            persistRound();
            render();
          }, delay);
        }

        function cashOut(auto) {
          if (!state.active || state.level < 1) return;
          const mult = multiplierAt(state.risk, state.level);
          const payout = state.betAmt * mult;
          const result = { won: true, profit: payout - state.betAmt, payout, payoutLabel: `${mult.toFixed(2)}x` };
          recordBet(state.betAmt, result);
          state.lastResult = result;
          // Reveal every tile in every row above the one just cleared so cashing out shows the
          // whole board — but these were never actually clicked, so they render dimmed (not
          // full-bright) via revealedDim, same treatment as the bet-detail snapshot.
          state.revealedDim = state.revealedDim || state.rows.map((row) => new Array(row.length).fill(false));
          for (let r = state.level; r < ROWS; r++) {
            for (let c = 0; c < state.revealed[r].length; c++) {
              state.revealed[r][c] = true;
              if (!state.clickedCells.has(`${r}:${c}`)) state.revealedDim[r][c] = true;
            }
          }
          state.active = false;
          state.busy = false;
          state.showResultOverlay = true;
          Shell.clearActiveRound(GAME_ID);
          render();
        }


        function dismissResultOverlay(e) {
          if (e && e.target.closest(".tower-result-card")) return;
          if (!state.showResultOverlay) return;
          state.showResultOverlay = false;
          render();
        }

        function tileHTML(rowIdx, colIdx, revealed, outcome, isActiveRow, mult, dim) {
          const key = rowIdx + ":" + colIdx;
          const cls = ["tower-tile"];
          if (revealed) {
            cls.push("revealed", outcome);
            if (dim) cls.push("dim-reveal");
            // Only the first time a tile is painted as revealed should it play its
            // pop/erupt animation. Subsequent re-renders (risk dropdown, settings
            // popover, etc.) rebuild this node fresh but must render it "settled".
            if (!state.animatedTiles.has(key)) cls.push("just-revealed");
          }
          const inner = revealed
            ? (outcome === "lava"
                ? `<span class="egg">🔥</span>`
                : `<span class="egg">🥚</span><span class="tmult">${mult.toFixed(2)}x</span>`)
            : ""; // blank until this specific tile is clicked (or swept in by a cash-out reveal)
          return `<div class="${cls.join(" ")}" ${isActiveRow && !revealed ? `data-tower-tile="${rowIdx}:${colIdx}"` : ""}>${inner}</div>`;
        }

        function gridHTML() {
          const rows = state.rows || buildRows(state.risk);
          const revealedRows = state.revealed || rows.map((row) => new Array(row.length).fill(false));
          const dimRows = state.revealedDim || rows.map((row) => new Array(row.length).fill(false));
          const parts = [];
          // After a round ends (cash-out or bust), state.active flips false but the board should
          // stay fully lit/visible rather than dimming back to the idle/pre-bet look — the round
          // just settled and showResultOverlay is the thing that visually communicates "it's over,"
          // not a washed-out board that reads as "nothing was revealed."
          const roundJustEnded = !state.active && state.showResultOverlay;
          for (let r = 0; r < ROWS; r++) {
            const isActiveRow = state.active && r === state.level;
            const isCleared = state.active ? r < state.level : roundJustEnded;
            const mult = multiplierAt(state.risk, r + 1);
            const cols = rows[r].length;
            parts.push(`<div class="tower-row ${isActiveRow ? "is-active" : ""} ${isCleared ? "is-cleared" : ""}" style="grid-template-columns:repeat(${cols}, 1fr);">
              ${rows[r].map((outcome, c) => tileHTML(r, c, revealedRows[r][c], outcome, isActiveRow, mult, dimRows[r][c])).join("")}
            </div>`);
          }
          // Every tile just painted as revealed above has now had its one shot at the
          // animation baked into this HTML string — mark them so future re-renders
          // (which recreate these nodes) skip the animation class.
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < revealedRows[r].length; c++) {
              if (revealedRows[r][c]) state.animatedTiles.add(r + ":" + c);
            }
          }
          return `<div class="tower-grid">${parts.join("")}</div>`;
        }

        function resultOverlayHTML(r) {
          return `<div class="tower-result-overlay" data-result-overlay>
            <div class="tower-result-card ${r.won ? "win" : "lose"}">
              <div class="tower-result-mult">${r.payoutLabel}</div>
              <div class="tower-result-amt ${r.won ? "win" : "lose"}">${r.won ? "+" + Shell.fmtMoney(r.payout) : "-" + Shell.fmtMoney(Math.abs(r.profit))}</div>
            </div>
          </div>`;
        }

        function render() {
          const balance = Shell.getBalance();
          const betRaw = parseFloat(state.betAmount);
          const hasBet = state.betAmount !== "" && !isNaN(betRaw) && betRaw > 0;
          const demoMode = !state.active && !hasBet;
          const insufficientBalance = !state.active && hasBet && betRaw > balance;
          const belowMinBet = !state.active && hasBet && Shell.isBelowMinBet(betRaw);
          const canCashOut = state.active && state.level >= 1 && !state.busy;
          const currentMult = state.active && state.level >= 1 ? multiplierAt(state.risk, state.level) : 1;
          const currentProfit = state.active && state.level >= 1 ? state.betAmt * currentMult - state.betAmt : 0;
          const nextLevel = (state.active ? state.level : 0) + 1;
          const nextMult = multiplierAt(state.risk, nextLevel);
          const nextProfit = state.betAmt > 0 ? (state.active ? state.betAmt : (parseFloat(state.betAmount) || 0)) * nextMult - (state.active ? state.betAmt : (parseFloat(state.betAmount) || 0)) : 0;
          const r = state.lastResult;

          content.innerHTML = `
            <div class="game-page">
              <div class="game-shell ${state.settings.animations ? "" : "no-animations"}">
                <div class="shell-grid">

                  <header class="title-bar">
                    <button class="game-icon-btn hover-tip" data-hover-tip="Game info" data-info>${svg("safe")}</button>
                    <div class="title-name">${GAME_NAME}</div>
                    <button class="fair-play-btn" data-fair-play>${svg("safe")} Fair Play</button>
                  </header>

                  <aside class="sidebar">
                    <div class="field-label">Bet Amount</div>
                    <div class="bet-input-row">
                      <span class="prefix">$</span>
                      <input type="text" inputmode="decimal" placeholder="0.00" value="${state.betAmount}" data-bet-input class="${(insufficientBalance || belowMinBet) ? "error" : ""}" ${state.active ? "disabled" : ""}>
                      <div class="bet-quick">
                        <button data-half ${state.active ? "disabled" : ""}>½</button>
                        <button data-double-bet ${state.active ? "disabled" : ""}>2×</button>
                      </div>
                    </div>
                    ${insufficientBalance ? `<div class="balance-error">Insufficient balance</div>` : (belowMinBet ? `<div class="balance-error">Minimum bet is $0.10</div>` : "")}

                    <div class="field-label" style="margin-top:14px;">Risk</div>
                    <div class="risk-row">
                      <button class="risk-toggle ${state.riskOpen ? "open" : ""}" data-risk-toggle ${state.active ? "disabled" : ""}>
                        <span>${RISK_MODES[state.risk].label}</span>${svg("chevronDown")}
                      </button>
                      ${state.riskOpen ? `<div class="risk-menu">
                        ${Object.entries(RISK_MODES).map(([key, m]) => `<button class="${state.risk === key ? "active" : ""}" data-risk-pick="${key}"><span>${m.label}</span>${riskDiamondsHTML(key)}</button>`).join("")}
                      </div>` : ""}
                    </div>

                    <div class="profit-box">
                      <div class="profit-box-top">
                        <div class="profit-box-col left"><span>Current Profit</span><strong>${Shell.fmtMoney(currentProfit)}</strong></div>
                        <div class="profit-box-chevron">›</div>
                        <div class="profit-box-col right"><span>Next</span><strong>${Shell.fmtMoney(Math.max(0, nextProfit))}</strong></div>
                      </div>
                      <div class="profit-box-bottom"><span class="cur">${state.active && state.level >= 1 ? currentMult.toFixed(2) : "0"}x</span><span class="divider">|</span><span class="nxt">${nextMult.toFixed(2)}x</span></div>
                    </div>

                    ${!state.active ? `
                    <button class="place-bet-btn ${hasBet ? "" : "demo"}" data-place ${(insufficientBalance || belowMinBet) ? "disabled" : ""} style="margin-top:12px;">
                      ${hasBet ? "Place Bet" : "Place Demo Bet"}
                    </button>
                    ${demoMode ? `<div class="demo-hint-wrap"><div class="demo-hint">Enter Bet Amount For Real Play</div></div>` : ""}` : `
                    <button class="tower-cashout-btn" data-cashout ${canCashOut ? "" : "disabled"} style="margin-top:12px;">
                      Cash Out ${state.level >= 1 ? `— ${Shell.fmtMoney(state.betAmt * currentMult)}` : ""}
                    </button>`}

                    <div class="sidebar-meta">
                      <div class="sidebar-meta-row"><span>Balance</span><strong>${Shell.fmtMoney(balance)}</strong></div>
                      ${state.active ? `<div class="sidebar-meta-row"><span>Row cleared</span><strong>${state.level} / ${ROWS}</strong></div>` : ""}
                    </div>
                  </aside>

                  <section class="game-box tower-stage">
                    ${gridHTML()}
                    ${r && state.showResultOverlay ? resultOverlayHTML(r) : ""}
                  </section>

                  <footer class="bottom-bar">
                    <div class="bottom-icons">
                      <div style="position:relative;">
                        <button class="bottom-icon-btn ${state.settingsOpen ? "active" : ""}" data-settings-toggle title="Settings">${svg("settings")}</button>
                        ${state.settingsOpen ? `
                        <div class="popover" data-settings-popover>
                          <div class="popover-title">Game Settings</div>
                          <div class="popover-row"><span>Animations</span><button class="switch ${state.settings.animations ? "on" : ""}" data-toggle-setting="animations" ${Shell.isAnimationsDisabled() ? "disabled" : ""}></button></div>
                          <div class="volume-row"><span>Volume — ${state.settings.volume}%</span><input type="range" min="0" max="100" value="${state.settings.volume}" data-volume-slider></div>
                        </div>` : ""}
                      </div>
                      <button class="bottom-icon-btn ${state.favorite ? "fav-on" : ""}" data-fav-toggle title="Favorite">${svg("heart")}</button>
                      <button class="bottom-icon-btn ${state.statsOpen ? "active" : ""}" data-stats-toggle title="Live stats">${svg("activity")}</button>
                    </div>
                    <div class="bottom-logo">Neon Jackpot</div>
                  </footer>
                </div>

                ${Shell.statsPanelHTML(state, GAME_ID, GAME_NAME)}
              </div>
            </div>

            ${state.infoOpen ? `
            <div class="modal-overlay" data-info-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${GAME_NAME}</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Climb the tower one row at a time. Each row has a safe path through and the
                rest is lava — pick a Golden Egg to advance and grow your multiplier, or hit Lava
                and lose the round. Cash out any time after clearing at least one row. Higher risk
                modes have fewer safe tiles per row but pay far more per row cleared.</p>
              </div>
            </div>` : ""}

            ${state.fairPlayOpen ? `
            <div class="modal-overlay" data-fair-play-overlay>
              <div class="modal-box">
                <div class="modal-head"><h3>${svg("safe")} Fair Play</h3><button class="modal-close" data-modal-close>${svg("x")}</button></div>
                <p>Each row's lava tile(s) are placed with an independent, uniformly random shuffle
                the moment you place your bet — later rows are not affected by earlier ones.
                Multipliers are generated directly from the odds: multiplier = (1 / (safe/total)^level)
                × 0.96, giving a consistent 96% return to player across every risk mode.</p>
              </div>
            </div>` : ""}
          `;

          bind();
        }

        function refocus(sel) {
          const el = document.querySelector(sel);
          if (el) { el.focus(); const v = el.value; el.value = ""; el.value = v; }
        }

        function bind() {
          if (state.showResultOverlay) {
            document.querySelector(".sidebar")?.addEventListener("click", dismissResultOverlay);
            document.querySelector("[data-result-overlay]")?.addEventListener("click", dismissResultOverlay);
          }

          document.querySelector("[data-place]")?.addEventListener("click", startRound);
          document.querySelector("[data-cashout]")?.addEventListener("click", () => cashOut(false));

          const betInput = document.querySelector("[data-bet-input]");
          betInput?.addEventListener("input", (e) => {
            state.betAmount = e.target.value.replace(/[^0-9.]/g, "");
            render();
            refocus("[data-bet-input]");
          });
          document.querySelector("[data-half]")?.addEventListener("click", () => {
            const b = parseFloat(state.betAmount) || 0;
            state.betAmount = (b / 2).toFixed(2);
            render();
          });
          document.querySelector("[data-double-bet]")?.addEventListener("click", () => {
            const b = parseFloat(state.betAmount) || 0;
            state.betAmount = Math.min(b * 2 || 0, Shell.getBalance()).toFixed(2);
            render();
          });

          document.querySelector("[data-risk-toggle]")?.addEventListener("click", (e) => { e.stopPropagation(); state.riskOpen = !state.riskOpen; render(); });
          document.querySelectorAll("[data-risk-pick]").forEach((btn) => btn.addEventListener("click", (e) => {
            e.stopPropagation();
            state.risk = btn.dataset.riskPick;
            state.riskOpen = false;
            // Switching risk mode is only possible when no round is active (button is disabled
            // otherwise), but the board from the last finished round (revealed tiles, result
            // overlay, win/loss card) was still lingering until the next "Place Bet" click.
            // Clear it immediately so the stage reflects the newly selected mode right away.
            if (!state.active) {
              state.rows = null;
              state.revealed = null;
              state.level = 0;
              state.lastResult = null;
              state.showResultOverlay = false;
            }
            render();
          }));
          document.addEventListener("click", (e) => {
            if (state.riskOpen && !e.target.closest(".risk-row")) { state.riskOpen = false; render(); }
          }, { once: true });

          document.querySelectorAll("[data-tower-tile]").forEach((el) => {
            el.addEventListener("click", () => {
              const [r, c] = el.dataset.towerTile.split(":").map((n) => parseInt(n, 10));
              pickTile(r, c);
            });
          });

          document.querySelector("[data-info]")?.addEventListener("click", () => { state.infoOpen = true; render(); });
          document.querySelector("[data-fair-play]")?.addEventListener("click", () => { state.fairPlayOpen = true; render(); });
          document.querySelectorAll("[data-modal-close]").forEach((btn) => btn.onclick = () => { state.infoOpen = false; state.fairPlayOpen = false; render(); });
          document.querySelector("[data-info-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.infoOpen = false; render(); } });
          document.querySelector("[data-fair-play-overlay]")?.addEventListener("click", (e) => { if (e.target === e.currentTarget) { state.fairPlayOpen = false; render(); } });

          document.querySelector("[data-settings-toggle]")?.addEventListener("click", () => { state.settingsOpen = !state.settingsOpen; render(); });
          document.querySelector("[data-toggle-setting]")?.addEventListener("click", (e) => {
            const key = e.currentTarget.dataset.toggleSetting;
            state.settings[key] = !state.settings[key];
            render();
          });
          document.querySelector("[data-volume-slider]")?.addEventListener("input", (e) => { state.settings.volume = parseInt(e.target.value, 10); });

          document.querySelector("[data-fav-toggle]")?.addEventListener("click", () => {
            Shell.toggleFavorite(GAME_ID);
            state.favorite = Shell.getFavorites().includes(GAME_ID);
            render();
          });

          document.querySelector("[data-stats-toggle]")?.addEventListener("click", () => { state.statsOpen = !state.statsOpen; render(); });
          Shell.bindStatsPanel(state, render);

          document.addEventListener("click", (e) => {
            if (state.settingsOpen && !e.target.closest("[data-settings-popover]") && !e.target.closest("[data-settings-toggle]")) {
              state.settingsOpen = false; render();
            }
          }, { once: true });
        }

        Shell.attachStatsPanelDrag(state, render);

        // Restore a round that was left in progress (e.g. the player navigated away by
        // accident) instead of dropping them back to the idle/pre-bet screen and forfeiting
        // the bet. Only restores here — busted/cashed-out rounds already clear this slot
        // themselves the instant they settle, so there's nothing to restore in that case.
        (function restoreRound() {
          const saved = Shell.loadActiveRound(GAME_ID);
          if (!saved) return;
          state.risk = saved.risk;
          state.betAmt = saved.betAmt;
          state.rows = saved.rows;
          state.revealed = saved.revealed;
          state.level = saved.level;
          state.active = true;
          state.lastResult = null;
          state.showResultOverlay = false;
        })();

        render();
      })();
    </script>
  </body>
</html>
